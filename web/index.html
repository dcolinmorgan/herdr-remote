<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<!-- The pin, before anything paints: someone who chose Dark must not be shown the OS's Light
     first. Inline because this app is one file with no build step and no CSP to satisfy, and a
     BARE string rather than JSON -- setTheme writes the same three words, and JSON.stringify
     would store `"dark"` with the quotes and silently stop this from ever firing. Someone on
     Auto -- the default -- needs none of it: `color-scheme: light dark` below gets their first
     paint right with no JavaScript at all. -->
<script>
try {
  var pinned = localStorage.getItem('herdr_theme');
  if (pinned === 'dark' || pinned === 'light') document.documentElement.dataset.theme = pinned;
} catch (e) {}  // Safari private mode throws on localStorage; Auto is the right fallback anyway.
</script>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;herdr-remote&quot;,&quot;short_name&quot;:&quot;herdr&quot;,&quot;start_url&quot;:&quot;/&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230a0a0a&quot;,&quot;theme_color&quot;:&quot;%230a0a0a&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;/icon-192.png&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/png&quot;},{&quot;src&quot;:&quot;/icon-512.png&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/png&quot;,&quot;purpose&quot;:&quot;any maskable&quot;},{&quot;src&quot;:&quot;/logo.svg&quot;,&quot;sizes&quot;:&quot;any&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>herdr-remote</title>
<script type="module">
import { play, bind } from 'https://esm.sh/cuelume@0.1.2';
window.cue = play;
document.addEventListener('DOMContentLoaded', () => bind());
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="header">
  <span class="dot" id="statusDot"></span>
  <h1>herdr</h1>
  <span id="connLabel" style="font-size:0.65rem;font-weight:500"></span>
  <span class="session-picker" id="sessionPicker">
    <button id="sessionSelector" onclick="toggleSessionMenu()" aria-haspopup="listbox"
            aria-expanded="false" aria-label="Switch herdr session"></button>
    <div id="sessionMenu" role="listbox" aria-label="herdr sessions"></div>
  </span>
  <span id="agentCount" style="font-size:0.7rem;color:var(--muted);margin-left:auto"></span>
  <button onclick="toggleTimeline()" aria-label="Timeline"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
  <button onclick="toggleSettings()" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>

<div class="settings" id="settingsView">
  <h2>Settings</h2>
  <div class="setting-group">
    <label id="themeLabel">Appearance</label>
    <div class="theme-seg" role="radiogroup" aria-labelledby="themeLabel">
      <button type="button" role="radio" data-theme-choice="auto" aria-checked="true" onclick="setTheme('auto')">Auto</button>
      <button type="button" role="radio" data-theme-choice="light" aria-checked="false" onclick="setTheme('light')">Light</button>
      <button type="button" role="radio" data-theme-choice="dark" aria-checked="false" onclick="setTheme('dark')">Dark</button>
    </div>
    <div class="hint">Auto follows the system. <span id="themeResolved"></span></div>
  </div>
  <div class="setting-group">
    <label for="relayUrl">Relay URL</label>
    <input id="relayUrl" type="url" placeholder="wss://your-tunnel.trycloudflare.com" />
    <label for="relayToken" style="margin-top:8px">Token (optional)</label>
    <input id="relayToken" type="password" placeholder="shared secret" />
    <button onclick="saveAndConnect()">Connect</button>
    <div class="hint">Run <code>./relay/start.sh</code> to get a URL. <a href="https://github.com/dcolinmorgan/herdr-remote/blob/main/QUICKSTART.md" style="color:var(--blue)">Setup guide →</a></div>
  </div>

  <div class="setting-group">
    <label>Saved Sessions</label>
    <div id="sessionList" style="margin:8px 0"></div>
    <button onclick="saveCurrentSession()" style="font-size:0.8rem;padding:8px 12px">+ Save Current Session</button>
    <div class="hint">Switch between multiple herdr relays.</div>
  </div>

  <div class="setting-group">
    <label>Push Notifications</label>
    <div id="pushStatus" style="font-size:0.75rem;margin-bottom:6px"></div>
    <button id="pushToggle" onclick="togglePush()">Enable Push</button>
    <div class="hint">Get notified when agents are blocked, even with this tab closed.</div>
  </div>
  <div class="setting-group">
    <label>Status</label>
    <div id="settingsStatus" style="font-size:0.75rem"></div>
  </div>
</div>

<div class="view" id="agentListView">
  <div class="agents" id="agents"></div>
</div>

<div class="view" id="timelineView" style="display:none;padding:12px;">
  <div id="timelineList" style="font-family:monospace;font-size:0.75rem;line-height:1.8;"></div>
</div>

<div class="terminal-view" id="terminalView">
  <div class="term-header">
    <button class="back" onclick="closeTerminal()" aria-label="Back to agent list"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <span class="title" id="termTitle"></span>
    <button class="search-btn icon-toggle" id="searchBtn" aria-pressed="false" onclick="toggleSearch()" aria-label="Find in output"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
    <button class="history-btn icon-toggle" id="historyBtn" aria-pressed="false" onclick="toggleHistory()" aria-label="Conversation history"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></button>
    <button class="refresh-btn" onclick="followPane()" aria-label="Refresh pane"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg></button>
  </div>
  <!-- space > tab > pane, the same three levels herdr itself has, in ONE row that can say two of
       them from inside a session. Both groups are built by renderSiblings as DOM nodes, and each is
       hidden on its own when it holds no choice: the tabs unless the space has two REACHABLE tabs
       (6 of 10 agent panes on the measured host sit in a single-tab space), the panes unless the
       tab holds a second pane (10 of 10 do there, so that group is the one that always shows).
       When neither has anything to say the row itself goes, border and all.
       The space above them is the one level left to the herd list, which is a tap on Back. -->
  <div class="term-sibs" id="termSibs" style="display:none">
    <div class="term-siblings" id="termTabs" aria-label="Tabs in this space" style="display:none"></div>
    <span class="sib-sep" id="termSibSep" style="display:none"></span>
    <div class="term-siblings" id="termSiblings" aria-label="Panes in this tab" style="display:none"></div>
  </div>
  <div class="term-history" id="termHistory" style="display:none">
    <div class="hist-bar">
      <!-- The title and the filter share this slot: exactly one of them is in the flow at a time,
           which is what keeps the header one row tall in both states. -->
      <span class="hist-title" id="historyTitle">Conversation History</span>
      <input class="hist-find" id="historyFind" type="text" placeholder="Filter loaded turns..." autocomplete="off" oninput="renderHistory()" style="display:none" />
      <span class="hist-count" id="historyCount"></span>
      <button class="hist-toggle" id="historyFindBtn" aria-pressed="false" onclick="toggleHistoryFind()" title="Filter loaded turns">Find</button>
      <button class="hist-toggle" id="historyToolsBtn" aria-pressed="true" onclick="toggleHistoryTools()" title="Show tool calls">Tools</button>
      <button class="hist-close" onclick="toggleHistory()" aria-label="Close history"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="hist-body" id="historyContent"></div>
  </div>
  <div class="term-search" id="termSearch" style="display:none">
    <input id="searchInput" type="text" placeholder="Find in output..." autocomplete="off" oninput="doSearch()" />
    <span id="searchCount"></span>
    <button onclick="searchNav(-1)" aria-label="Previous"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg></button>
    <button onclick="searchNav(1)" aria-label="Next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
    <button onclick="toggleSearch()" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="term-content" id="termContent">Loading…</div>
  <div class="quick-actions" id="quickActions"></div>
  <div class="term-input">
    <button class="term-cmd" onclick="openCommandPalette()" aria-label="Commands">/</button>
    <input id="termInput" placeholder="Type…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <button class="dock-toggle dock-quick" id="quickDockBtn" aria-pressed="false" onclick="toggleQuickDock()" aria-label="Quick actions"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></button>
    <button class="dock-toggle dock-keys" id="keysDockBtn" aria-pressed="false" onclick="toggleKeysDock()" aria-label="Keys"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10"/></svg></button>
    <button class="term-send" onclick="sendText()" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>
  <div class="term-keys" id="termKeys" style="display:none">
    <!-- Key queue strip (visible when composing) -->
    <div id="keyQueueStrip" style="display:none;width:100%;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:6px;flex-wrap:wrap;gap:4px;align-items:center"></div>
    <!-- Pad switch and the presets disclosure share one line -->
    <div class="keys-bar">
      <button class="tab-btn" id="tabKeys" aria-pressed="true" onclick="switchKeyTab('keys')">Keys</button>
      <button class="tab-btn" id="tabDigits" aria-pressed="false" onclick="switchKeyTab('digits')">123</button>
      <button class="presets-btn" id="presetsBtn" aria-pressed="false" onclick="toggleCtrlPresets()">Presets <span id="ctrlChevron">▸</span></button>
    </div>
    <!-- Keys pad -->
    <div id="keysPad" style="width:100%">
      <div class="keys-grid">
        <button class="nav-key" style="grid-area:esc" onclick="fireKey('Escape')">Esc</button>
        <button class="nav-key" style="grid-area:space" onclick="fireKey('Space')">Space</button>
        <button class="nav-key" style="grid-area:pgup" onclick="fireKey('PageUp')">PgUp</button>
        <button class="nav-key" style="grid-area:up" onclick="fireKey('Up')">↑</button>
        <button class="nav-key" style="grid-area:tab" onclick="fireKey('Tab')">Tab</button>
        <button class="nav-key" style="grid-area:enter;flex-direction:column;gap:1px" onclick="fireKey('Enter')">⏎<span style="font-size:9px;opacity:0.75">Enter</span></button>
        <button class="nav-key mod-key" style="grid-area:ctrl" id="modCtrl" onclick="armMod('ctrl')">Ctrl</button>
        <button class="nav-key mod-key" style="grid-area:shift" id="modShift" onclick="armMod('shift')">⇧</button>
        <button class="nav-key" style="grid-area:pgdn" onclick="fireKey('PageDown')">PgDn</button>
        <button class="nav-key" style="grid-area:left" onclick="fireKey('Left')">←</button>
        <button class="nav-key" style="grid-area:down" onclick="fireKey('Down')">↓</button>
        <button class="nav-key" style="grid-area:right" onclick="fireKey('Right')">→</button>
      </div>
      <div id="ctrlPresets" style="display:none;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px"></div>
    </div>
    <!-- Digits pad -->
    <div id="digitsPad" style="display:none;width:100%;grid-template-columns:repeat(9,1fr);gap:3px"></div>
    <!-- Action keys for blocked state -->
    <div id="actionKeys" style="width:100%;margin-top:4px"></div>
  </div>
  <!-- Quick actions dock -->
  <div class="term-keys" id="quickDock" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:8px">
      <span style="font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted)">Quick Actions</span>
      <button onclick="toggleQuickDock()" aria-label="Close" style="background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%">
      <button class="nav-key" style="color:var(--green);border-color:var(--green)" onclick="quickSend('yes')">yes</button>
      <button class="nav-key" style="color:var(--red);border-color:var(--red)" onclick="quickSend('no')">no</button>
      <button class="nav-key" onclick="quickSend('continue')">continue</button>
      <button class="nav-key" onclick="quickSend('retry')">retry</button>
      <button class="nav-key" onclick="quickSend('skip')">skip</button>
      <button class="nav-key" onclick="quickSend('commit and push')">commit&nbsp;&amp;&nbsp;push</button>
    </div>
  </div>
</div>

<!-- Command palette -->
<!-- Context Menu -->
<div id="contextMenu" style="display:none;position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3);min-width:160px;padding:4px;">
  <div id="contextMenuItems"></div>
</div>

<div id="cmdPalette" style="display:none;position:fixed;inset:0;z-index:100;">
  <div onclick="closePalette()" style="position:absolute;inset:0;background:rgba(0,0,0,0.5)"></div>
  <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;max-height:50dvh;background:var(--surface);border-top-left-radius:16px;border-top-right-radius:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
      <span style="font-size:0.8rem;font-weight:600;flex:1">Commands</span>
      <button onclick="closePalette()" aria-label="Close" style="background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer">✕</button>
    </div>
    <input id="cmdSearch" type="text" placeholder="Search commands…" autocomplete="off" autocorrect="off" style="margin:8px 12px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px" oninput="filterCommands()" />
    <div id="cmdList" style="overflow-y:auto;padding:4px 12px;"></div>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/markdown.js"></script>
<script src="js/diff.js"></script>
<script src="js/triage.js"></script>
<script src="js/spaces.js"></script>
<script src="js/cards.js"></script>
<script src="js/mirror.js"></script>
<script src="js/nav.js"></script>
<script src="js/palette.js"></script>
<script src="js/push.js"></script>
</body>
</html>
