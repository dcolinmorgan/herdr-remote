    const parts = nodeText.split(regex);
    if (parts.length > 1) {
      const frag = document.createDocumentFragment();
      const matches = nodeText.match(regex) || [];
      parts.forEach((part, i) => {
        frag.appendChild(document.createTextNode(part));
        if (matches[i]) {
          const mark = document.createElement('mark');
          mark.className = matchIdx === searchIndex ? 'search-current' : 'search-highlight';
          mark.textContent = matches[i];
          mark.dataset.matchIndex = matchIdx++;
          frag.appendChild(mark);
        }
      });
      node.parentNode.replaceChild(frag, node);
    }
  });
  
  el.innerHTML = tempDiv.innerHTML;
  searchIndex = 0;
  countEl.textContent = `1/${searchMatches.length}`;
  scrollToMatch();
}

function searchNav(dir) {
  if (!searchMatches.length) return;
  searchIndex = (searchIndex + dir + searchMatches.length) % searchMatches.length;
  document.getElementById('searchCount').textContent = `${searchIndex + 1}/${searchMatches.length}`;
  
  // Update highlight classes
  document.querySelectorAll('.search-highlight, .search-current').forEach((el, i) => {
    el.className = i === searchIndex ? 'search-current' : 'search-highlight';
  });
  scrollToMatch();
}

function scrollToMatch() {
  const current = document.querySelector('.search-current');
  if (current) current.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function clearSearch() {
  const el = document.getElementById('termContent');
  if (originalContent) {
    el.innerHTML = originalContent;
    el.__mirror = null;
    originalContent = '';
  }
  searchMatches = [];
  searchIndex = 0;
  document.getElementById('searchCount').textContent = '';
}

// Long-press context menu
let longPressTimer = null;
let contextTarget = null;

function showContextMenu(e, type, id, name) {
  e.preventDefault();
  const menu = document.getElementById('contextMenu');
  const items = document.getElementById('contextMenuItems');
  contextTarget = { type, id, name };
  
  // Focus first on every kind: it is the one action that answers "take me to it", and it is what
  // the relay can do for a space that holds no agent at all.
  const focusItemHtml = `
      <div class="ctx-item" onclick="focusItem()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Focus in herdr
      </div>`;
  let html = '';
  if (type === 'tab') {
    html = `${focusItemHtml}
      <div class="ctx-item" onclick="renameItem()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        Rename Tab
      </div>
      <div class="ctx-item danger" onclick="closeItem()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        Close Tab
      </div>
    `;
  } else if (type === 'workspace') {
    html = focusItemHtml;
  } else if (type === 'agent') {
    html = `${focusItemHtml}
      <div class="ctx-item" onclick="renameItem()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        Rename Agent
      </div>
      <div class="ctx-item" onclick="interruptAgent()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        Interrupt (Esc)
      </div>
    `;
  }
  items.innerHTML = html;
  
  // Position menu
  const x = Math.min(e.clientX || e.touches?.[0]?.clientX || 100, window.innerWidth - 180);
  const y = Math.min(e.clientY || e.touches?.[0]?.clientY || 100, window.innerHeight - 120);
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.style.display = 'block';
  navPush('ctxmenu', hideMenu);
  
  if (window.cue) cue('tick');
}

function hideContextMenu() { navClose('ctxmenu', hideMenu); }

function hideMenu() {
  document.getElementById('contextMenu').style.display = 'none';
  contextTarget = null;
}

function renameItem() {
  if (!contextTarget) return;
  const newName = prompt(`Rename ${contextTarget.type}:`, contextTarget.name || '');
  if (newName && ws) {
    if (contextTarget.type === 'tab') {
      const {host, id} = splitKey(contextTarget.id);
      ws.send(JSON.stringify({ type: 'rename_tab', tab_id: id, host, label: newName }));
    } else if (contextTarget.type === 'agent') {
      // `herdr agent rename`, which sets the label every client shows. The old path typed
      // `/rename <name>` into the pane, and claude has no such command -- it landed in the
      // composer as literal text for the operator to clear by hand.
      ws.send(JSON.stringify({ type: 'rename_agent', pane_id: contextTarget.id, label: newName }));
    }
    if (window.cue) cue('success');
  }
  hideContextMenu();
}

function closeItem() {
  if (!contextTarget || contextTarget.type !== 'tab') return;
  if (confirm(`Close tab "${contextTarget.name || contextTarget.id}"?`)) {
    const {host, id} = splitKey(contextTarget.id);
    if (ws) ws.send(JSON.stringify({ type: 'close_tab', tab_id: id, host }));
    if (window.cue) cue('droplet');
  }
  hideContextMenu();
}

function interruptAgent() {
  if (!contextTarget || contextTarget.type !== 'agent') return;
  if (ws) ws.send(JSON.stringify({ type: 'send_keys', pane_id: contextTarget.id, keys: ['Escape'] }));
  if (window.cue) cue('toggle');
  hideContextMenu();
}

// Close context menu on click outside

// Long press handler for touch
function setupLongPress(el, type, id, name) {
  el.addEventListener('touchstart', (e) => {
    longPressTimer = setTimeout(() => showContextMenu(e, type, id, name), 500);
  }, { passive: true });
  el.addEventListener('touchend', () => clearTimeout(longPressTimer));
  el.addEventListener('touchmove', () => clearTimeout(longPressTimer));

  el.addEventListener('contextmenu', (e) => showContextMenu(e, type, id, name));
}

function sendText() {
  if(imeComposing)return;
  const i=document.getElementById('termInput');
  if(!i.value||!ws||!activePane)return;
  const agent=agents.find(a=>a.pane_id===activePane);
  if (!agent && shellPane(activePane)) {
    // One message rather than send_text + Enter: the relay runs both halves and audits it as
    // respond_shell, which is the line that says a command was run rather than text typed.
    ws.send(JSON.stringify({type:'respond',pane_id:activePane,text:i.value}));
    i.value='';
    setTimeout(refreshPane,400);
    return;
  }
  if(agent&&agent.status==='blocked') {
    ws.send(JSON.stringify({type:'respond',pane_id:activePane,prompt_id:agent.prompt_id,text:i.value}));
  } else {
    ws.send(JSON.stringify({type:'send_text',pane_id:activePane,text:i.value}));
    ws.send(JSON.stringify({type:'send_keys',pane_id:activePane,keys:['Enter']}));
  }
  i.value=''; setTimeout(refreshPane,500);
}
function sendKey(k){if(!ws||!activePane)return;ws.send(JSON.stringify({type:'send_keys',pane_id:activePane,keys:[k]}));setTimeout(refreshPane,300);}
function sendKeys(k){if(!ws||!activePane)return;ws.send(JSON.stringify({type:'send_keys',pane_id:activePane,keys:k}));setTimeout(refreshPane,300);}

// --- Nav Tray (collie-style) ---
let keyQueue = [], armedMod = null, ctrlConfirm = null;
const CTRL_PRESETS = [
  {label:'Ctrl C', keys:['ctrl+c']},
  {label:'Ctrl D', keys:['ctrl+d'], danger:true},
  {label:'Ctrl U', keys:['ctrl+u']},
  {label:'Ctrl R', keys:['ctrl+r']},
  {label:'Ctrl L', keys:['ctrl+l']},
  {label:'Ctrl Z', keys:['ctrl+z'], danger:true},
  // herdr's key validator refuses Home/End in every spelling; the relay turns these two into the
  // CSI bytes a terminal sends (ESC[1;5H / ESC[1;5F) and delivers them as text instead.
  {label:'Ctrl Home', keys:['ctrl+Home']},
  {label:'Ctrl End', keys:['ctrl+End']},
];
const DANGER_KEYS = new Set(['ctrl+c','ctrl+d','ctrl+z']);

function fireKey(k) {
  if(window.cue) cue('tick');
  const composed = armedMod ? `${armedMod}+${k}` : k;
  if (keyQueue.length > 0 || armedMod) {
    keyQueue.push(composed);
    armedMod = null;
    if(window.cue) cue('droplet');
    renderKeyQueue();
    renderMods();
  } else {
    sendKeys([composed]);
  }
}

function armMod(m) {
  armedMod = armedMod === m ? null : m;
  if(window.cue) cue('toggle');
  renderMods();
}

function renderMods() {
  const s = document.getElementById('modShift');
  const c = document.getElementById('modCtrl');
  if (s) s.classList.toggle('armed', armedMod === 'shift');
  if (c) c.classList.toggle('armed', armedMod === 'ctrl');
}

function renderKeyQueue() {
  const strip = document.getElementById('keyQueueStrip');
  if (!keyQueue.length && !armedMod) { strip.style.display = 'none'; return; }
  strip.style.display = 'flex';
  let html = keyQueue.map((k,i) => {
    const isDanger = DANGER_KEYS.has(k.toLowerCase());
    const label = k.includes('+') ? k.replace('ctrl+','Ctrl ').replace('shift+','\u21e7 ') : k;
    return `<span class="queue-chip${isDanger?' danger':''}" onclick="removeQueueKey(${i})">${label} \u00d7</span>`;
  }).join('');
  if (armedMod) html += `<span style="color:var(--muted);font-size:12px;padding:4px">${armedMod==='shift'?'\u21e7':'Ctrl'} + \u2026</span>`;
  html += `<span style="margin-left:auto;display:flex;gap:4px">`;
  html += `<button onclick="sendQueuedKeys()" style="padding:6px 12px;border-radius:6px;border:none;background:${keyQueue.some(k=>DANGER_KEYS.has(k.toLowerCase()))?'var(--red)':'var(--blue)'};color:var(--on-accent);font-size:12px;font-weight:600;cursor:pointer">Send</button>`;
  html += `<button onclick="clearKeyQueue()" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;cursor:pointer">✕</button>`;
  html += `</span>`;
  strip.innerHTML = html;
}

function removeQueueKey(i) { keyQueue.splice(i,1); renderKeyQueue(); }
function clearKeyQueue() { keyQueue=[]; armedMod=null; renderKeyQueue(); renderMods(); }
function sendQueuedKeys() {
  if (!keyQueue.length) return;
  if(window.cue) cue('success');
  sendKeys(keyQueue);
  keyQueue=[]; armedMod=null; renderKeyQueue(); renderMods();
}

// The two docks are mutually exclusive, so both buttons are restated on every change -- opening one
// has to un-light the other, and that is easy to forget when only the opened one is touched.
function showDock(which) {
  const keys = which === 'keys';
  document.getElementById('termKeys').style.display = keys ? '' : 'none';
  document.getElementById('quickDock').style.display = which === 'quick' ? '' : 'none';
  setPressed('keysDockBtn', keys);
  setPressed('quickDockBtn', which === 'quick');
  if(window.cue) cue(which ? 'page' : 'tick');
}

function toggleKeysDock() {
  showDock(document.getElementById('termKeys').style.display === 'none' ? 'keys' : null);
}

function toggleQuickDock() {

}

function quickSend(text) {
  if (!ws || !activePane) return;

  ws.send(JSON.stringify({type:'send_text', pane_id: activePane, text: text}));

}

function switchKeyTab(tab) {
  setPressed('tabKeys', tab==='keys');
  setPressed('tabDigits', tab==='digits');
  // The disclosure shares its line with the switch now, so it has to leave with the pad it opens.
  document.getElementById('presetsBtn').style.display = tab==='keys' ? '' : 'none';
  document.getElementById('keysPad').style.display = tab==='keys' ? '' : 'none';
  const dp = document.getElementById('digitsPad');
  dp.style.display = tab==='digits' ? 'grid' : 'none';
  if (tab==='digits' && !dp.innerHTML) {
    dp.innerHTML = [1,2,3,4,5,6,7,8,9].map(d => `<button class="digit-key" onclick="fireKey('${d}')">${d}</button>`).join('');
  }
}

function toggleCtrlPresets() {
  const el = document.getElementById('ctrlPresets');
  const chevron = document.getElementById('ctrlChevron');
  const show = el.style.display === 'none';
  el.style.display = show ? 'grid' : 'none';
  setPressed('presetsBtn', show);
  chevron.textContent = show ? '\u25be' : '\u25b8';
  if (show && !el.innerHTML) {
    el.innerHTML = CTRL_PRESETS.map(p => {
      const cls = p.danger ? 'ctrl-key danger' : 'ctrl-key';
      return `<button class="${cls}" onclick="pressCtrl('${p.label}')">${p.label}</button>`;
    }).join('');
  }
}

function pressCtrl(label) {
  const preset = CTRL_PRESETS.find(p => p.label === label);
  if (!preset) return;
  // If composing (queue has items), just stage it
  if (keyQueue.length > 0) { keyQueue.push(...preset.keys); renderKeyQueue(); return; }
  // Two-tap confirm for danger keys
  if (preset.danger && ctrlConfirm !== label) {
    ctrlConfirm = label;
    if(window.cue) cue('error');
    const el = document.getElementById('ctrlPresets');
    el.innerHTML = CTRL_PRESETS.map(p => {
      const cls = p.danger ? (p.label===label?'ctrl-key confirm':'ctrl-key danger') : 'ctrl-key';
      const txt = p.label===label ? 'Confirm?' : p.label;
      return `<button class="${cls}" onclick="pressCtrl('${p.label}')">${txt}</button>`;
    }).join('');
    setTimeout(() => { ctrlConfirm=null; toggleCtrlPresets(); toggleCtrlPresets(); }, 3000);
    return;
  }
  ctrlConfirm = null;
  sendKeys(preset.keys);
}

let imeComposing = false, imeEndedAt = 0;
{
  const ti = document.getElementById('termInput');
  ti.addEventListener('compositionstart',()=>{imeComposing=true;});
  ti.addEventListener('compositionend',()=>{imeComposing=false;imeEndedAt=Date.now();});
  ti.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    // Enter belongs to the IME while composing - intercepting it drops the preedit
    if(imeComposing||e.isComposing||e.keyCode===229)return;

    if(Date.now()-imeEndedAt<80)return;

  });
}
// `scroll` says nothing about which axis moved, and a long line is exactly when the reader moves
// the other one. `scrollTop === 0` is true for the whole of a horizontal drag -- and permanently
// true whenever the output is shorter than the box -- so this fired loadMore on every scroll event
// sideways: measured, one wheel right took the read from 200 lines to 600 and the next to 1000,
// each answer a different content that replaced the mirror under the reader's hands. Only a
// vertical move that ARRIVES at the top is a request for more.
let mirrorScrollTop = 0;
document.getElementById('termContent').addEventListener('scroll', function() {
  const el = this;
  userScrolledUp = (el.scrollHeight - el.scrollTop - el.clientHeight) > 50;
  const moved = el.scrollTop !== mirrorScrollTop;
  mirrorScrollTop = el.scrollTop;
  if (moved && el.scrollTop === 0 && el.scrollHeight > el.clientHeight) loadMore();
});
document.getElementById('historyContent').addEventListener('scroll', function() {
  if (this.scrollTop <= 4) loadOlderHistory();
});

function getAgentCommands() {
  const a = agents.find(x => x.pane_id === activePane);
  if (!a) return [];
  const key = (a.agent || '').toLowerCase();
  if (COMMANDS[key]) return COMMANDS[key];
  if (key.startsWith('claude')) return COMMANDS.claude;
  if (key.startsWith('codex')) return COMMANDS.codex;
  if (key.startsWith('pi') || key === 'kiro') return COMMANDS.pi;
  if (key.startsWith('opencode')) return COMMANDS.opencode;
  return COMMANDS.claude; // fallback
}

function openCommandPalette() {
  if(window.cue) cue('page');
  document.getElementById('cmdPalette').style.display = '';
  navPush('palette', hidePalette);
  document.getElementById('cmdSearch').value = '';
  filterCommands();
  document.getElementById('cmdSearch').focus();
}
function closePalette() { navClose('palette', hidePalette); }
function hidePalette() { document.getElementById('cmdPalette').style.display = 'none'; }

function filterCommands() {
  const q = (document.getElementById('cmdSearch').value || '').toLowerCase();
  const cmds = getAgentCommands();
  const filtered = q ? cmds.filter(c => c.cmd.includes(q) || c.desc.toLowerCase().includes(q)) : cmds.filter(c => c.common);
  const el = document.getElementById('cmdList');
  if (!filtered.length) { el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.8rem">No commands match</div>'; return; }
  el.innerHTML = filtered.map(c => `<div role="button" tabindex="0" onclick="runCommand('${c.cmd}')" onkeydown="if(event.key==='Enter')runCommand('${c.cmd}')" style="padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:2px;transition:background 0.15s" onmouseover="this.style.background='var(--border)'" onmouseout="this.style.background=''">
    <span style="font-family:monospace;font-weight:600;font-size:0.85rem;${c.danger?'color:var(--red)':'color:var(--blue)'}">${c.cmd}</span>
    <span style="flex:1;font-size:0.75rem;color:var(--muted)">${c.desc}</span>
  </div>`).join('');
}

function runCommand(cmd) {
  closePalette();
  if (!ws || !activePane) return;
  ws.send(JSON.stringify({type:'send_text', pane_id: activePane, text: cmd}));
  ws.send(JSON.stringify({type:'send_keys', pane_id: activePane, keys:['Enter']}));
  setTimeout(refreshPane, 500);
}

// --- Web Push ---
let pushSubscription = null;

async function initPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    document.getElementById('pushStatus').textContent = 'Push not supported in this browser';
    document.getElementById('pushToggle').style.display = 'none';
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    pushSubscription = await reg.pushManager.getSubscription();
    updatePushUI();
  } catch (e) {
    document.getElementById('pushStatus').textContent = 'Service worker error: ' + e.message;
  }
}

function updatePushUI() {
  const btn = document.getElementById('pushToggle');
  const status = document.getElementById('pushStatus');
  if (pushSubscription) {
    btn.textContent = 'Disable Push';
    btn.style.background = 'var(--red)';
    status.innerHTML = '<span style="color:var(--green)">● Enabled</span>';
  } else {
    btn.textContent = 'Enable Push';
    btn.style.background = 'var(--green)';
    status.innerHTML = '<span style="color:var(--muted)">○ Disabled</span>';
  }
}

async function togglePush() {
  if (pushSubscription) {
    // Unsubscribe
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({type: 'push_unsubscribe', subscription: pushSubscription.toJSON()}));
    }
    await pushSubscription.unsubscribe();
    pushSubscription = null;
    updatePushUI();
  } else {
    // Subscribe
    try {
      const relayUrl = localStorage.getItem('herdr_relay_url') || '';
      const httpUrl = relayUrl.replace('wss://', 'https://').replace('ws://', 'http://');
      const resp = await fetch(httpUrl + '/api/vapid-public-key');
      const {publicKey} = await resp.json();
      if (!publicKey) {
        document.getElementById('pushStatus').textContent = 'VAPID key not configured on relay';
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      pushSubscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({type: 'push_subscribe', subscription: pushSubscription.toJSON()}));
      }
      updatePushUI();
    } catch (e) {
      document.getElementById('pushStatus').textContent = 'Error: ' + e.message;
    }
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
