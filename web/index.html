  else if (msg.type === 'blocked') {
    const a = agents.find(x => x.pane_id === msg.pane_id);
    if (a) {
      a.status='blocked';
      a.prompt=msg.prompt;
      a.prompt_id=msg.prompt_id;
      a.options=msg.options;
      a.selected_options=msg.selected_options||[];
      a.multi_options=msg.multi_options||[];
      a.interaction=msg.interaction;
      a.multi=msg.multi;
    }
    else agents.push({...msg, status:'blocked'});
    if(window.cue) cue('chime');
    if (!msg.update) {
      timeline.unshift({project: msg.project, agent: msg.agent, status: 'blocked', time: new Date()});
      if (timeline.length > 100) timeline.pop();
    }
    render();
    if (msg.pane_id===activePane) openTerminal(activePane);
  } else if (msg.type === 'pane_content' && msg.pane_id === activePane) {
    if (msg.process && msg.process.name) {
      paneProcess[msg.pane_id] = msg.process;
      const shell = shellPane(msg.pane_id);
      if (shell) {
        document.getElementById('termTitle').textContent =
          `${shell.label||shell.project||shell.pane_id} · ${msg.process.name}`;
      }
    }
    const el = document.getElementById('termContent');
    // A read that was already in flight when the drag started, or a manual refresh: the tick's own
    // guard catches neither, and the line the reader is selecting inside can still be the line
    // mirrorPatch has to rewrite.
    if (selectionInside(el)) return;
    const prevHeight = el.scrollHeight;
    const prevScroll = el.scrollTop;
    // Nothing moved, so nothing here may move either -- not the DOM, and not the scroll, which the
    // fix-up below would otherwise yank to the bottom every 3s.
    if (!mirrorPatch(el, msg.content || '(empty)')) return;
    if (userScrolledUp) {
      // Keep scroll position relative to bottom (content may have grown at top)
      const growth = el.scrollHeight - prevHeight;
      el.scrollTop = prevScroll + growth;
    } else {
      el.scrollTop = el.scrollHeight;
    }
  } else if (msg.type === 'history' && msg.pane_id === activePane) {
    receiveHistory(msg);
  }
}

// A missing id must NOT reach the key as the string "undefined". It did, and everything downstream
// read `local|undefined` as a real space: splitKey handed back the truthy "undefined", render()'s
// `!k.endsWith('|')` guard let it through, and a relay that reports no hierarchy at all -- the demo
// worker, any relay older than `spaces` -- got one fabricated group per host, named after whichever
// project happened to be first, with its blocked agent buried inside it.
function spaceKey(host, id) { return `${host || 'local'}|${id || ''}`; }
function agentWorkspaceKey(a) { return spaceKey(a.host, a.workspace_id); }
function agentTabKey(a) { return spaceKey(a.host, a.tab_id); }

function workspaceRows() {
  if (spaces.workspaces.length) {
    // herdr's own list: the label the operator gave the space, the number they see on it, and the
    // full pane count -- including the shell panes the relay does not list, which is how a space
    // can legitimately show up here holding no agents at all.
    return spaces.workspaces.map(w => ({
      key: spaceKey(w.host, w.workspace_id), id: w.workspace_id, host: w.host || 'local',
      name: w.label || w.workspace_id, number: w.number || 0,
      focused: !!w.focused, paneCount: w.pane_count || 0,
    })).sort((a, b) => a.number - b.number);
  }
  // No hierarchy from this relay: group by the ids on the agents and name each space after a
  // pane's project, which is the best guess available.
  const seen = new Map();
  for (const a of agents) {
    if (!a.workspace_id) continue;
    const key = agentWorkspaceKey(a);
    if (!seen.has(key)) {
      seen.set(key, {key, id: a.workspace_id, host: a.host || 'local',
                     name: a.project || a.workspace_id, number: 0, focused: false, paneCount: 0});
    }
  }
  return [...seen.values()];
}

function tabRows(workspaceKey) {
  if (spaces.tabs.length) {
    return spaces.tabs
      .filter(t => spaceKey(t.host, t.workspace_id) === workspaceKey)
      .map(t => ({
        key: spaceKey(t.host, t.tab_id), id: t.tab_id, host: t.host || 'local',
        // A rename is a label that is not a bare integer -- NOT one that differs from `number`.
        // Live on this host: `wT:t4` has label "2" and number 4, because herdr's label is the tab's
        // POSITION in its space while the number is a separate counter. Comparing the two called
        // that a rename and rendered a heading reading `2` beside one reading `Tab 1`. And the
        // position is the right thing to show: it is what the desk shows.
        name: /^\d+$/.test((t.label || '').trim()) || !t.label ? `Tab ${t.label || t.number}` : t.label,
        number: t.number || 0, focused: !!t.focused, paneCount: t.pane_count || 0,
      }))
      .sort((a, b) => a.number - b.number);
  }
  const seen = new Map();
  agents.filter(a => agentWorkspaceKey(a) === workspaceKey).forEach((a) => {
    if (!a.tab_id || seen.has(agentTabKey(a))) return;
    seen.set(agentTabKey(a), {key: agentTabKey(a), id: a.tab_id, host: a.host || 'local',
                              name: a.label || `Tab ${seen.size + 1}`, number: seen.size + 1,
                              focused: false, paneCount: 0});
  });
  return [...seen.values()];
}

// ---- Triage: the one ordering the whole page agrees on ----------------------
//
// What needs you, then what is newly ready, then what is running, then everything else by when you
// last touched it. The herd list, the space chips and the tab chips all route through `bucketOf`, so
// a list row and a chip cannot come to disagree about what a colour means.
//
// It runs on the two timestamps the relay keeps per pane (see CLAUDE.md, "Pane activity"):
//   last_active_at -- when the agent last changed status
//   last_seen_at   -- when you last opened or drove it through the relay
const TRIAGE_ORDER = ['needs', 'ready', 'working', 'recent'];
// One colour per bucket rather than per status, which is the whole point: `done` means two
// different things depending on whether you have looked at it, and only the bucket knows which.
// Orange for ready sits where it belongs on red -> orange -> green -> grey, and leaves blue to mean
// selection, which is all it means anywhere else on this page.
const TRIAGE_COLOR = {
  needs: 'var(--red)', ready: 'var(--orange)', working: 'var(--green)', recent: 'var(--muted)',
};
const TRIAGE_META = {
  needs: {label: 'Needs you', accent: true},
  ready: {label: 'Ready · unseen'},
  working: {label: 'Working'},
  // The only foldable section, and the only one the direction toggle reaches. Collapsing an alert
  // defeats the alert, so the three above are pinned open.
  recent: {label: 'Recent', collapsible: true},
};

/** An agent that finished while you were not looking.
 *
 * NOT a stored flag -- it is this comparison, which is why opening the pane clears it with no
 * bookkeeping: the read bumps `last_seen_at` past `last_active_at` and the row falls into Recent on
 * the next snapshot. Both timestamps absent (a relay older than them) yields false, so the section
 * is simply empty there. */
function isUnseen(p) {
  return p.status === 'done' && (p.last_active_at || 0) > (p.last_seen_at || 0);
}

/** The single classifier. */
function bucketOf(p) {
  if (p.status === 'blocked') return 'needs';
  if (isUnseen(p)) return 'ready';
  if (p.status === 'working') return 'working';
  return 'recent';
}

/** The most urgent bucket in a set -- what a tab or space chip should advertise. Null when the set
 *  holds no agent at all, which is deliberately NOT the same as idle: an empty tab has nothing to
 *  report, and giving it a resting dot would claim otherwise. */
function worstTriage(list) {
  let best = null;
  for (const p of list) {
    const rank = TRIAGE_ORDER.indexOf(bucketOf(p));
    if (best === null || rank < best) best = rank;
  }
  return best === null ? null : TRIAGE_ORDER[best];
}

/** Bucket and order the herd. Empty sections come back too; the caller drops them, which keeps
 *  "which sections exist" a property of this function rather than of each view.
 *
 *  The no-timestamp path is free: every comparator returns 0, `Array.prototype.sort` is stable, so
 *  each section keeps the order the relay already sent. No feature detection, no branch. */
function triage(list, dir) {
  const into = {needs: [], ready: [], working: [], recent: []};
  for (const p of list) into[bucketOf(p)].push(p);
  const byDesc = key => (x, y) => (key(y) || 0) - (key(x) || 0);
  const active = byDesc(p => p.last_active_at);
  into.needs.sort(active);
  into.ready.sort(active);
  into.working.sort(active);
  into.recent.sort(byDesc(p => p.last_seen_at));
  if (dir === 'oldest') into.recent.reverse();
  return TRIAGE_ORDER.map(key => ({key, ...TRIAGE_META[key], panes: into[key]}));
}

// Recent's two controls, remembered because a phone reopens this page constantly and a fold that
// forgets itself is a fold nobody uses.
let recentDir = localStorage.getItem('herdr_recent_dir') === 'oldest' ? 'oldest' : 'newest';
let recentOpen = localStorage.getItem('herdr_recent_open') !== '0';
function flipRecentDir() {
  recentDir = recentDir === 'newest' ? 'oldest' : 'newest';
  localStorage.setItem('herdr_recent_dir', recentDir);
  render();
}
function toggleRecentOpen() {
  recentOpen = !recentOpen;
  localStorage.setItem('herdr_recent_open', recentOpen ? '1' : '0');
  render();
}

// ---- Naming lookups, built once per render ---------------------------------
//
// Per pane these were spaces x panes each time, and this page re-renders on every snapshot. One
// pass, then map lookups.
let spaceNameByKey = new Map();
let tabLabelByKey = new Map();
let tabCountBySpace = new Map();

function rebuildNameMaps(rows) {
  spaceNameByKey = new Map(rows.map(r => [r.key, r.name]));
  tabLabelByKey = new Map();
  tabCountBySpace = new Map();
  for (const t of spaces.tabs) {
    const wsKey = spaceKey(t.host, t.workspace_id);
    tabLabelByKey.set(spaceKey(t.host, t.tab_id), t.label || '');
    tabCountBySpace.set(wsKey, (tabCountBySpace.get(wsKey) || 0) + 1);
  }
}

/** A tab label worth putting on screen.
 *
 * herdr labels an unlabelled tab POSITIONALLY -- it returns "1", "2" -- so a naive join renders
 * `herdr-remote-dev · 1`, which reads as a bug rather than as a name. With one tab in the space
 * there is nothing to disambiguate, so the positional default is dropped. With two or more the
 * number stays: it is weak, but it is the only thing telling two panes in the same project apart,
 * and it is what the desk shows. */
function meaningfulTabLabel(label, tabCount) {
  const trimmed = (label || '').trim();
  if (!trimmed) return null;
  if (tabCount <= 1 && /^\d+$/.test(trimmed)) return null;
  return trimmed;
}

// A rebuild drops the selection the reader is holding. Both containers that carry selectable text
// are rewritten on a timer -- the mirror every 3s from `pane_content`, the herd list on every 2s
// `agents` snapshot -- and `replaceChildren`/`innerHTML` detach the very text nodes the range's
// endpoints live in, so the browser has nothing left to anchor it to and the highlight vanishes
// mid-copy. A selection could therefore not survive three seconds, which is less than it takes to
// reach the copy button on a phone.
//
// So a tick that would rewrite a container the reader is selecting inside does not run. Nothing is
// queued: the tick repeats, so what it skipped arrives on the next one once the selection is
// released. The pause explains itself -- the highlight is on screen -- and it is the only honest
// option, since there is no way to re-anchor a range to nodes that no longer exist.
function selectionInside(el) {
  if (!el) return false;
  const sel = window.getSelection && window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return false;
  for (let i = 0; i < sel.rangeCount; i++) {
    const range = sel.getRangeAt(i);
    // The endpoints are TEXT nodes, and `Node.contains` takes any node -- comparing elements would
    // miss the common case, where both ends sit inside one text node.
    if (el.contains(range.startContainer) || el.contains(range.endContainer)) return true;
  }
  return false;
}

function render() {
  document.getElementById('agentCount').textContent = agents.length ? `${agents.length}` : '';
  const rows = workspaceRows();
  rebuildNameMaps(rows);
  // A terminal that appears or goes away beside the open pane changes the strips, and this is every
  // path a snapshot arrives by. Cheap: two arrays already in hand, at most eight chips. After the
  // name maps, not before, because the tabs row is named out of the same hierarchy they are.
  renderSiblings();
  // A space selection is only reachable while the strip that offers it is up, and the strip is up
  // exactly when the panes span more than one space.
  const occupied = new Set([...agents, ...shellPanes]
    .map(p => agentWorkspaceKey(p)).filter(k => !k.endsWith('|')));
  if (occupied.size <= 1) { activeWorkspace = null; activeTab = null; }
  const list = document.getElementById('agents');
  // Checked here rather than at the top of render(), so the name maps and the sibling strips still
  // track the truth while the list itself holds still.
  if (selectionInside(list)) return;
  list.innerHTML = activeWorkspace ? renderSpaceView(rows) : renderHerd(rows, occupied);
  bindLongPressHandlers();
}

// The herd, in the one order the app agrees on. AGENTS only: two thirds of the panes on a real host
// are bare shells with no status at all, and triaging them would bury ten agents under twenty rows
// that can never be anything but Recent. They are reached through the space view, which groups by
// tab, and through the sibling strip inside a session.
function renderHerd(rows, occupied) {
  let html = occupied.size > 1 ? spaceStrip(rows) : '';
  const sections = triage(agents, recentDir);
  for (const s of sections) {
    if (!s.panes.length) continue;
    html += sectionHeader(s);
    if (s.key === 'recent' && !recentOpen) continue;
    html += s.panes.map(p => agentCard(p, 'herd')).join('');
  }
  if (!agents.length) {
    html += shellPanes.length
      ? `<div class="empty">No agents running. ${shellPanes.length} terminal${shellPanes.length === 1 ? '' : 's'} — pick a space to reach them.</div>`
      // Nothing at all is the case that has a REASON worth printing -- mid-switch, or pointed at
      // a session that is not running -- so it goes through emptyStateHtml rather than repeating
      // its default here.
      : (spaces.workspaces.length ? '<div class="empty">No agents running.</div>'
                                  : emptyStateHtml());
  }
  return html;
}

function sectionHeader(s) {
  const tint = s.accent ? ` style="color:${TRIAGE_COLOR[s.key]}"` : '';
  let controls = '';
  if (s.collapsible) {
    // Direction reaches Recent and nothing else: an attention section is ordered by urgency, and
    // urgency does not invert.
    controls =
      `<button class="sec-btn" onclick="flipRecentDir()" aria-label="Sort ${recentDir === 'newest' ? 'oldest' : 'newest'} first">`
      + `${recentDir === 'newest' ? '↓' : '↑'}</button>`
      + `<button class="sec-btn" onclick="toggleRecentOpen()" aria-expanded="${recentOpen}"`
      + ` aria-label="${recentOpen ? 'Collapse' : 'Expand'} ${s.label}">${recentOpen ? '⌃' : '⌄'}</button>`;
  }
  return `<div class="section-header"${tint}><span class="dot" style="background:${TRIAGE_COLOR[s.key]}"></span>`
    + `<span class="sec-label">${escapeHtml(s.label)}</span> <span class="sec-count">(${s.panes.length})</span>${controls}</div>`;
}

// One space's panes, grouped by tab -- agents AND bare shells, which is the only view that shows
// both together and the only one where "what is in this tab" is the question being asked.
function renderSpaceView(rows) {
  let html = spaceStrip(rows) + tabStrip(rows);
  const groups = groupPanesByTab(activeWorkspace);
  const shown = activeTab ? groups.filter(g => g.key === activeTab) : groups;
  for (const g of shown) {
    if (!activeTab) html += tabHeading(g);
    html += g.panes.length
      ? g.panes.map(p => p.agent ? agentCard(p, 'tab') : shellCard(p, 'tab')).join('')
      // A freshly created tab holds one shell the relay may not have listed yet, and an empty tab is
      // a real thing to see rather than an absence to hide.
      : '<div class="empty-tab">(empty tab)</div>';
  }
  if (!shown.length) {
    html += `<div class="empty">${activeTab ? 'This tab has no panes.' : 'This space has no panes.'}</div>`;
  }
  return html;
}

function tabHeading(g) {
  const dot = worstTriage(g.panes.filter(p => p.agent));
  return `<div class="tab-heading">`
    + (dot ? `<span class="dot" style="background:${TRIAGE_COLOR[dot]}"></span>` : '')
    + `${escapeHtml(g.name)} <span class="sec-count">(${g.panes.length})</span></div>`;
}

/** A workspace's panes by tab, in tab order, including empty tabs. Panes whose tab is not in the
 *  tab list yet -- a brief poll race after a create -- fall into a trailing group so they are never
 *  lost -- the list is the panes, and the hierarchy only names and orders them. */
function groupPanesByTab(workspaceKey) {
  const panes = [], seen = new Set();
  for (const p of [...agents, ...shellPanes]) {
    // By pane_id: the two arrays are disjoint in a snapshot, but a `blocked` push can add an agent
    // record for a pane still sitting in shellPanes.
    if (seen.has(p.pane_id) || agentWorkspaceKey(p) !== workspaceKey) continue;
    seen.add(p.pane_id);
    panes.push(p);
  }
  const tabs = tabRows(workspaceKey);
  const groups = tabs.map(t => ({
    key: t.key, name: t.name, focused: t.focused,
    panes: panes.filter(p => agentTabKey(p) === t.key),
  }));
  const known = new Set(tabs.map(t => t.key));
  const orphans = panes.filter(p => !known.has(agentTabKey(p)));
  if (orphans.length) groups.push({key: `${workspaceKey}|other`, name: '…', panes: orphans});
  return groups;
}

function spaceStrip(rows) {
  let html = `<div class="chip-strip"><span class="chip-label">Spaces</span>`;
  html += `<button class="chip${activeWorkspace === null ? ' active' : ''}" onclick="backToWorkspaces()">All</button>`;
  for (const w of rows) {
    const held = [...agents, ...shellPanes].filter(p => agentWorkspaceKey(p) === w.key);
    // One dot from the one classifier, so this chip and the row it stands for cannot disagree. No
    // dot at all when the space holds no agent -- see worstTriage.
    const bucket = worstTriage(held.filter(p => p.agent));
    // herdr's own count, shown whenever it exceeds what this client can serve: with
    // HERDR_SHELL_PANES off, a space of five panes drew one card and said nothing about the other four.
    const hint = w.paneCount > held.length ? ` (${w.paneCount})` : '';
    html += `<button class="chip${activeWorkspace === w.key ? ' active' : ''}${w.focused ? ' focused' : ''}"
      onclick="selectWorkspace('${escapeAttr(w.key)}')" data-ws-key="${escapeAttr(w.key)}" data-ws-name="${escapeAttr(w.name)}"
      title="${escapeAttr(w.focused ? w.name + ' — herdr is here' : w.name)}">`
      + (bucket ? `<span class="dot chip-dot" style="background:${TRIAGE_COLOR[bucket]}"></span>` : '')
      + `${escapeHtml(w.name)}${hint}</button>`;
  }
  return html + `</div>`;
}

function tabStrip(rows) {
  const wsTabs = tabRows(activeWorkspace);
  let html = `<div class="chip-strip"><span class="chip-label">Tabs</span>`;
  if (wsTabs.length > 1) {
    html += `<button class="chip${!activeTab ? ' active' : ''}" onclick="selectTab(null)">All</button>`;
  }
  for (const t of wsTabs) {
    const bucket = worstTriage(agents.filter(a => agentTabKey(a) === t.key));
    html += `<button class="chip${activeTab === t.key ? ' active' : ''}${t.focused ? ' focused' : ''}"
      onclick="selectTab('${escapeAttr(t.key)}')" data-tab-key="${escapeAttr(t.key)}" data-tab-name="${escapeAttr(t.name)}"
      title="${escapeAttr(t.focused ? t.name + ' — herdr is here' : t.name)}">`
      + (bucket ? `<span class="dot chip-dot" style="background:${TRIAGE_COLOR[bucket]}"></span>` : '')
      + `${escapeHtml(t.name)}</button>`;
  }
  html += `<button class="chip chip-add" onclick="createTab()" title="New tab here">+</button>`;
  return html + `</div>`;
}

function emptyStateHtml() {
  if (switchingSession) return '<div class="empty">switching…</div>';
  // Only meaningful with exactly one source: with remotes configured,
  // "local" being idle says nothing about why the list is empty overall.
  const sources = sessionState?.sources || [];
  if (sources.length === 1) {
    const local = sources[0];
    const active = local.active || 'default';
    const entry = local.sessions.find(s => s.name === active);
    // Same wording herdr-remote-session prints, so CLI and UI agree.
    if (entry && !entry.running) {
      return `<div class="empty">session '${active}' is not running</div>`;
    }
  }
  return '<div class="empty">Waiting for agents…</div>';
}

function bindLongPressHandlers() {
  // Bind to spaces and tabs
  document.querySelectorAll('[data-ws-key]').forEach(el => {
    setupLongPress(el, 'workspace', el.dataset.wsKey, el.dataset.wsName);
  });
  document.querySelectorAll('[data-tab-key]').forEach(el => {
    setupLongPress(el, 'tab', el.dataset.tabKey, el.dataset.tabName);
  });
  // Bind to agents
  document.querySelectorAll('[data-pane-id]').forEach(el => {
    const id = el.dataset.paneId;
    const name = el.dataset.agentName;
    setupLongPress(el, 'agent', id, name);
  });
}

function selectWorkspace(key) { activeWorkspace = key; activeTab = null; render(); }

let sessionState = null;

function renderSessionSelector() {
  const btn = document.getElementById('sessionSelector');
  const menu = document.getElementById('sessionMenu');
  const picker = document.getElementById('sessionPicker');
  const sources = sessionState?.sources || [];
  const total = sources.reduce((n, s) => n + s.sessions.length, 0);
  // Nothing to switch between: stay out of the way. Hide the wrapper, not just
  // the button, or the header's flex gap leaves a stray space behind.
  if (total < 2) { picker.style.display = 'none'; menu.style.display = 'none'; return; }
  picker.style.display = '';

  const multiSource = sources.length > 1;
  if (multiSource) {
    // The trigger used to show local's session unconditionally, so with
    // remotes configured switching a remote looked like it did nothing.
    // Stay neutral instead of naming one specific source's session.
    btn.textContent = 'sessions ▾';
  } else {
    const local = sources[0];
    const active = local.active || 'default';
    const entry = local.sessions.find(s => s.name === active);
    // Fall back to the raw active value when nothing matches, so a
    // mismatch (e.g. herdr's default session not literally named
    // "default") degrades to a correct-but-unticked label rather than a
    // confidently wrong one.
    btn.textContent = (entry ? entry.name : local.active) + ' ▾';
  }

  const rowTargets = [];
  menu.innerHTML = sources.map(src => {
    const header = multiSource
      ? `<div class="chip-label" style="padding:4px 8px">${escapeHtml(src.host)}</div>`
      : '';
    const rows = src.sessions.map(s => {
      const active = (src.active || 'default') === s.name;
      const dim = s.running ? '' : 'opacity:0.55;';
      rowTargets.push({ host: src.host, session: s.name });
      // The tick lives in a fixed-width span so ticked and unticked names
      // start at the same x. A bare space would collapse in HTML.
      return `<div role="option" aria-selected="${active}" tabindex="0" style="${dim}"`
           + `><span class="session-mark">${active ? '✓' : ''}</span>`
           + `${escapeHtml(s.name)}${s.running ? '' : ' ·'}</div>`;
    }).join('');
    return header + rows;
  }).join('');

  // Host/session go on via the dataset property setter, not string
  // interpolation, so a name or host containing quotes or markup can't
  // break out of an attribute or inject JS. Wired after innerHTML is set,
  // since the rows above carry no onclick/onkeydown of their own.
  menu.querySelectorAll('[role="option"]').forEach((row, i) => {
    row.dataset.host = rowTargets[i].host;
    row.dataset.session = rowTargets[i].session;
    const activate = () => switchHerdrSession(row.dataset.host, row.dataset.session);
    row.addEventListener('click', activate);
    row.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(); }
    });
  });
}

function toggleSessionMenu() {
  const menu = document.getElementById('sessionMenu');
  // Read the computed style, not the inline one: the menu starts hidden via
  // the stylesheet, so menu.style.display is '' on the first click and an
  // inline-only check would silently "close" an already-closed menu.
  const show = getComputedStyle(menu).display === 'none';
  menu.style.display = show ? 'block' : 'none';
  document.getElementById('sessionSelector').setAttribute('aria-expanded', String(show));
}

let switchingSession = false;

function switchHerdrSession(host, session) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  document.getElementById('sessionMenu').style.display = 'none';
  document.getElementById('sessionSelector').setAttribute('aria-expanded', 'false');
  // A switch clears relay state and re-polls; a bare empty list would read as
  // breakage. Routed through the existing render path, not by poking the DOM —
  // there is no #agentList element. Mutate local state only after we know
  // the send will happen, so a dead socket can't leave the UI stuck showing
  // "switching…" forever.
  switchingSession = true;
  agents = [];
  render();
  ws.send(JSON.stringify({ type: 'session_switch', host, session }));
}

function backToWorkspaces() { activeWorkspace = null; activeTab = null; render(); }
function selectTab(key) { activeTab = key; render(); }

// A key is `host|id`; the relay wants those apart, since the id alone does not say which machine.
function splitKey(key) {
  const cut = (key || '').indexOf('|');
  return cut < 0 ? {host: 'local', id: key || ''} : {host: key.slice(0, cut), id: key.slice(cut + 1)};
}

function createTab() {
  if (!ws || !activeWorkspace) return;
  const {host, id} = splitKey(activeWorkspace);
  if (window.cue) cue('sparkle');
  ws.send(JSON.stringify({type:'create_tab', workspace_id: id, host}));
  setTimeout(() => { activeTab = null; }, 1500);
}

// Move herdr's own focus to whatever was long-pressed. Which id field is sent tells the relay what
// to focus, so a pane, a tab and a space all go through the one message.
function focusItem() {
  if (!contextTarget || !ws) return;
  const {type, id} = contextTarget;
  const {host, id: bare} = type === 'agent' ? {host: '', id} : splitKey(id);
  const field = type === 'agent' ? 'pane_id' : type === 'tab' ? 'tab_id' : 'workspace_id';
  ws.send(JSON.stringify({type: 'focus', [field]: bare, ...(host ? {host} : {})}));
  if (window.cue) cue('toggle');
  hideContextMenu();
}

// ---- What a pane row is CALLED ---------------------------------------------
//
// Two questions, not one, so two functions and an explicit scope rather than one function guessing
// from whatever heading happens to be above it.
//
// In the herd the title line carries the two things that LOCATE a piece of work -- the space and the
// tab -- because that is what is unknown there. In a space's own view both are already established
// by the heading above the card, so repeating them says nothing, and worse: two panes in one tab
// would become indistinguishable, since the pane's own name is the only thing telling them apart.

/** The pane's own name: the operator's label, else the pane id.
 *
 *  Deliberately NOT `project`, which the relay sets to `basename(cwd)` -- a space's panes nearly all
 *  share it, so on a real host every card in `tmp-workspace` was called `tmp-workspace`, and so was
 *  the heading above them. The id is the only field that always separates two siblings.
 *
 *  Also what `rename_agent` is prefilled with and what the row announces, so those cannot drift from
 *  what the card shows. */
function paneName(p) { return p.label || p.pane_id; }

/** The cwd, but only when it says something the space label does not.
 *
 *  A space is almost always named after its directory, so this line spent itself repeating line one:
 *  `herdr-remote-dev` above `app-tools/herdr-remote-dev`, on row after row. Dropping it when the
 *  directory's own name matches keeps the path for exactly the case that carries information -- a
 *  pane sitting somewhere OTHER than the space root, in a worktree or a subdirectory. */
function informativeCwd(p, project) {
  if (!p.cwd) return null;
  if (baseName(p.cwd).toLowerCase() === (project || '').trim().toLowerCase()) return null;
  return shortCwd(p);
}

function shortCwd(p) { return p.cwd ? p.cwd.split('/').slice(-2).join('/') : null; }
function baseName(path) { return (path || '').split('/').filter(Boolean).pop() || ''; }

/** Herd scope: the parts, UNJOINED, because at 390px they must not truncate as one string.
 *
 *  Every pane in one project begins `herdr-remote-dev · `, so tail-truncating the joined title eats
 *  the tab name and leaves every row reading `herdr-remote-dev · d…` -- the characters that survive
 *  are the ones every row shares. Separate spans let the PROJECT give up width first and the tab --
 *  the only discriminator -- survive.
 *
 *  `project` is the SPACE's label, not `p.project`: the relay sets that to `basename(cwd)`, which is
 *  a per-pane fact and the very thing informativeCwd decides whether to show on line two. */
function paneParts(p) {
  const project = spaceNameByKey.get(agentWorkspaceKey(p)) || p.project || p.workspace_id || '';
  // A hand-set name first, then what the pane says it is doing. The title sits ahead of the cwd
  // because it is the only one of the three that tracks the work as it moves -- and in the herd this
  // exists to untangle (several agents in ONE project) the cwd is identical on every row, so it
  // discriminates nothing.
  const tabCount = tabCountBySpace.get(agentWorkspaceKey(p)) || 0;
  return {
    project,
    tab: meaningfulTabLabel(tabLabelByKey.get(agentTabKey(p)), tabCount),
    secondary: herdSecondary(p, project),
  };
}

/** Tab scope: the pane's own name leads, the cwd sits beneath. */
function paneTitleInTab(p) {
  return {primary: paneName(p), secondary: shortCwd(p)};
}

/** Line two in the herd, and the id is the last resort rather than an ornament: measured on this
 *  host, three agents share one tab of one space whose directory is the space's own name, so their
 *  label, their tab and their cwd are all empty or identical and the row would read
 *  `tuyaos-ai-qemu` three times. */
function herdSecondary(p, project) {
  return (p.label || p.title || '') || informativeCwd(p, project) || p.pane_id;
}

/** Line one, as spans. See paneParts for why it is not a string. */
function titleHtml(p, scope, host) {
  if (scope === 'tab') {
    return `<span class="pane-project">${escapeHtml(paneTitleInTab(p).primary)}</span>${host}`;
  }
  const parts = paneParts(p);
  return `<span class="pane-project">${escapeHtml(parts.project)}</span>`
    + (parts.tab ? `<span class="pane-sep"> · </span><span class="pane-tab">${escapeHtml(parts.tab)}</span>` : '')
    + host;
}

function secondaryOf(p, scope) {
  return (scope === 'tab' ? paneTitleInTab(p) : paneParts(p)).secondary;
}

function hostHtml(p) {
  return p.host && p.host !== 'local'
    ? `<span class="pane-host" style="color:var(--orange);font-size:0.6rem">@${escapeHtml(p.host)}</span>` : '';
}

function agentCard(a, scope) {
  // The dot is the BUCKET's colour, not the status's: `done` means two different things depending on
  // whether you have looked at it, and only the bucket knows which.
  const bucket = bucketOf(a);
  const pulseClass = a.status === 'working' ? ' pulse' : '';
  const named = paneName(a);
  const secondary = secondaryOf(a, scope);
  // The harness stays on line two. Collie can drop it because its rows carry an agent avatar; this
  // page has none, so the only place `claude` is written is here.
  const meta = [escapeHtml(a.agent), secondary ? escapeHtml(secondary) : '']
    .filter(Boolean).join(' · ');
  return `<div class="agent${bucket === 'needs' ? ' blocked' : ''}${bucket === 'ready' ? ' ready' : ''}${a.focused ? ' focused' : ''}" role="button" tabindex="0" aria-label="${escapeAttr(named)}, ${TRIAGE_META[bucket].label}${a.focused ? ', focused in herdr' : ''}" data-pane-id="${escapeAttr(a.pane_id)}" data-agent-name="${escapeAttr(named)}" data-bucket="${bucket}" onclick="openTerminal('${escapeAttr(a.pane_id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTerminal('${escapeAttr(a.pane_id)}')}">
    <span class="dot${pulseClass}" style="background:${TRIAGE_COLOR[bucket]}" aria-hidden="true"></span>
    <div class="info"><div class="project">${titleHtml(a, scope, hostHtml(a))}</div><div class="meta">${meta}</div></div>
    <span style="color:var(--muted);font-size:1.2rem" aria-hidden="true">›</span>
  </div>`;
}

function shellCard(p, scope) {
  // Same shape as an agent card so the list reads as one list, but a hollow dot rather than a fourth
  // shade of grey competing with Recent -- a terminal has no status to colour, and worstTriage says
  // the same thing by returning null for a set that holds only these.
  const named = paneName(p);
  const secondary = secondaryOf(p, scope);
  // The pane id, which within ONE workspace is the only thing that separates two of them: the 20
  // shell panes on this host collapse to 12 distinct cwd basenames inside their own spaces -- three
  // share a directory in wS, two in wE, because a workspace is usually one worktree. Dropped here
  // once it has become the card's own title, since printing it twice said it no better.
  const meta = [named === p.pane_id ? '' : p.pane_id, secondary || ''].filter(Boolean)
    .map(part => part === p.pane_id
      ? `<span style="font-family:monospace">${escapeHtml(part)}</span>` : escapeHtml(part))
    .join(' · ');
  return `<div class="agent shell${p.focused ? ' focused' : ''}" role="button" tabindex="0" data-shell="1"
    aria-label="${escapeAttr(named)}, terminal${p.focused ? ', focused in herdr' : ''}"
    data-pane-id="${escapeAttr(p.pane_id)}" data-agent-name="${escapeAttr(named)}"
    onclick="openTerminal('${escapeAttr(p.pane_id)}')"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTerminal('${escapeAttr(p.pane_id)}')}">
    <span class="dot dot-hollow" aria-hidden="true"></span>
    <div class="info"><div class="project">${titleHtml(p, scope, hostHtml(p))}</div><div class="meta">${meta}</div></div>
    <span style="color:var(--muted);font-size:1.2rem" aria-hidden="true">›</span>
  </div>`;
}

// The two rows under the session header, both drawn from the snapshot already in hand.
//
// What replaced what: this was one flat row of the OTHER panes in the workspace, tagged `Tab` and
// `Space`, each chip named `label || pane_id`. On the host this was measured against, 28 of the 30
// panes carry no operator label -- so that row read `w6:pH  w6:pQ  w6:pR`, three chips whose names
// differ by one character and say nothing about what is inside them, with no mark for the pane you
// were actually in and no way to reach a tab by name. Now it is herdr's own two levels: the tabs of
// this space, then the panes of this tab, each named by what the pane can still say for itself.
function renderSiblings() {
  const me = paneById(activePane);
  // No workspace id means this relay reports no hierarchy at all, and every pane would look like a
  // sibling of every other one. Nothing is better than a wrong neighbourhood.
  const wsKey = me && me.workspace_id ? agentWorkspaceKey(me) : null;
  const tabs = renderTabStrip(me, wsKey);
  const panes = renderPaneStrip(me, wsKey);
  // The separator is the boundary between the two levels, so it exists only when both are there --
  // a rule that hangs off what the two strips actually rendered rather than off a second count.
  const sep = document.getElementById('termSibSep');
  if (sep) sep.style.display = tabs && panes ? 'block' : 'none';
  const row = document.getElementById('termSibs');
  if (row) row.style.display = tabs || panes ? 'flex' : 'none';
  scrollSibsToOpenPane();
}

// One row holds both levels now, so it overflows sooner -- and the chip that must not be off screen
// is the one saying where you are. Computed rather than scrollIntoView(), which on a fixed-position
// ancestor also scrolls the document and takes the header with it.
function scrollSibsToOpenPane() {
  const row = document.getElementById('termSibs');
  // The PANE chip, not whichever marked chip comes first: the tab you are in is the leftmost thing
  // in the row and is never the one off screen, so matching it would report the job already done.
  const cur = row && (row.querySelector('#termSiblings [aria-current="true"]')
                      || row.querySelector('[aria-current="true"]'));
  if (!cur || row.style.display === 'none') return;
  const chip = cur.getBoundingClientRect(), box = row.getBoundingClientRect();
  if (chip.left < box.left) row.scrollLeft -= box.left - chip.left + 8;
  else if (chip.right > box.right) row.scrollLeft += chip.right - box.right + 8;
}

// Every pane in one space. By pane_id, not by array: the two lists are disjoint in a snapshot, but
// a `blocked` push can add an agent record for a pane still sitting in shellPanes, and that pane
// would draw two chips. One order for both strips, and creation order in practice: herdr numbers a
// pane's suffix p1, p2, ... p9, pA, pB, which sorts lexicographically into the order they opened.
function panesInSpace(wsKey) {
  if (!wsKey) return [];
  const seen = new Set(), list = [];
  for (const p of [...agents, ...shellPanes]) {
    if (seen.has(p.pane_id) || agentWorkspaceKey(p) !== wsKey) continue;
    seen.add(p.pane_id);
    list.push(p);
  }
  return list.sort((a, b) => a.pane_id.localeCompare(b.pane_id));
}

// The same panes, keyed by tab. Panes with no tab id are absent rather than pooled: a relay that
// reports no tabs has no level here to draw, and the pane row falls back to the whole space.
function panesByTab(wsKey) {
  const byTab = new Map();
  for (const p of panesInSpace(wsKey)) {
    if (!p.tab_id) continue;
    const key = agentTabKey(p);
    if (!byTab.has(key)) byTab.set(key, []);
    byTab.get(key).push(p);
  }
  return byTab;
}

// Where a tab chip lands you: the neediest agent in it, and failing that its first terminal. Ranked
// through `bucketOf` like everything else on this page, so the tap goes to the pane that would have
// been highest in the herd list -- if something in there is blocked, that is what you meant.
function tabLandingPane(list) {
  const rank = p => (p.agent ? TRIAGE_ORDER.indexOf(bucketOf(p)) : TRIAGE_ORDER.length);
  return [...list].sort((a, b) => rank(a) - rank(b) || a.pane_id.localeCompare(b.pane_id))[0];
}

// Returns whether it drew anything, which is what tells the shared row whether it has to exist.
function renderTabStrip(me, wsKey) {
  const strip = document.getElementById('termTabs');
  if (!strip) return false;
  strip.replaceChildren();
  const byTab = panesByTab(wsKey);
  // A tab with no pane we can name is not a place we can go -- there is no CLI for switching the
  // web client to an empty tab, and a chip that does nothing is worse than no chip. This is also
  // what keeps the row honest with HERDR_SHELL_PANES off: it becomes the tabs holding agents.
  const rows = tabRows(wsKey).filter(t => (byTab.get(t.key) || []).length);
  // One tab is not a choice, and 6 of the 10 agent panes measured live in a single-tab space --
  // they would each have paid a chip to be told the name of the only tab there is.
  if (rows.length < 2) { strip.style.display = 'none'; return false; }
  const mine = me && me.tab_id ? agentTabKey(me) : null;
  strip.append(...rows.map(t => tabChip(t, byTab.get(t.key), t.key === mine)));
  strip.style.display = 'flex';
  return true;
}

function tabChip(row, list, current) {
  const chip = document.createElement('button');
  chip.className = 'term-sib sib-tab';
  chip.dataset.sibTab = row.id;
  if (current) chip.setAttribute('aria-current', 'true');
  // The same dot the space and tab chips in the herd carry, from the same classifier -- so a tab
  // says what is going on inside it before you open it. Null for a tab holding only terminals,
  // which is `worstTriage` declining to invent a fifth shade for a pane that has no status.
  const bucket = worstTriage(list.filter(p => p.agent));
  const dot = document.createElement('span');
  dot.className = bucket ? 'dot' : 'dot dot-hollow';
  if (bucket) dot.style.background = TRIAGE_COLOR[bucket];
  const name = document.createElement('span');
  name.className = 'sib-name';
  name.textContent = row.name;
  chip.append(dot, name);
  chip.setAttribute('aria-label', `Tab ${row.name}, ${list.length} pane${list.length === 1 ? '' : 's'}`);
  // Tapping the tab you are already in would be a no-op switch; leave it inert rather than
  // re-entering openTerminal and closing the panels you have open.
  if (!current) chip.onclick = () => openTerminal(tabLandingPane(list).pane_id);
  return chip;
}

function renderPaneStrip(me, wsKey) {
  const strip = document.getElementById('termSiblings');
  if (!strip) return false;
  strip.replaceChildren();
  // No tab id on the open pane means this relay reports no tabs at all; fall back to the whole
  // space, which is the set this row used to show and still the only one available.
  const list = me && me.tab_id ? (panesByTab(wsKey).get(agentTabKey(me)) || [])
                               : panesInSpace(wsKey);
  // Nothing to switch to means nothing to anchor either, so the row costs nothing -- 3 of the 10
  // agent panes measured have no pane beside them.
  if (list.length < 2) { strip.style.display = 'none'; return false; }
  strip.append(...list.map(p => siblingChip(p, p.pane_id === activePane)));
  strip.style.display = 'flex';
  return true;
}

/** What a chip is called.
 *
 * `label || pane_id` degenerated to the pane id for 28 of the 30 panes on the measured host, so this
 * falls through Collie's order (paneDisplayName) instead: the operator's label, then what the pane
 * itself is saying it is doing, then what it is. The pane id's suffix rides along as a tag either
 * way, because a name that repeats across tabmates -- three shells in `herdr`, three claudes in one
 * tab -- still needs something that does not. `project` is never in here: the relay sets it to
 * basename(cwd), which by construction every pane in one worktree shares. */
function paneChipName(p) {
  // `title` is herdr's terminal title with the harness banner stripped (activity_title), so it is
  // there while an agent is working -- 2 of the 10 agent panes measured, both saying something real
  // -- and empty when it is idle or done. A `panes` entry has no such field at all.
  return p.label || (p.agent ? (p.title || p.agent) : (baseName(p.cwd) || 'shell'));
}

function siblingChip(p, current) {
  // A `panes` entry has no `agent` field at all; an agent entry always does. Same test the card
  // renderers use, one array apart.
  const shell = !p.agent;
  const chip = document.createElement('button');
  chip.className = 'term-sib';
  chip.dataset.sibId = p.pane_id;
  chip.dataset.sibShell = shell ? '1' : '0';
  if (current) chip.setAttribute('aria-current', 'true');
  const dot = document.createElement('span');
  dot.className = shell ? 'dot dot-hollow' : 'dot';
  // The bucket's colour, not the status's -- the same thing the card and the section header say,
  // through the same classifier, so the strip needs no legend of its own.
  if (!shell) dot.style.background = TRIAGE_COLOR[bucketOf(p)];
  const name = document.createElement('span');
  name.className = 'sib-name';
  name.textContent = paneChipName(p);
  name.title = name.textContent;   // the CSS clips it at 32vw; this is where the rest of it lives
  const tail = document.createElement('span');
  tail.className = 'sib-tag';
  tail.textContent = p.pane_id.split(':').pop();
  chip.append(dot, name, tail);
  chip.setAttribute('aria-label',
    `${shell ? 'Terminal' : 'Agent'} ${name.textContent} ${tail.textContent}${current ? ', open' : ''}`);
  if (!current) chip.onclick = () => openTerminal(p.pane_id);
  return chip;
}

// A switch is not a refresh. The read for the pane you just picked is a relay round trip away --
// milliseconds on this host, an SSH hop and up to seconds on a remote one -- and until it lands the
// mirror on screen is the output of the pane you LEFT, under the new pane's title and beside its
// filled chip. That is the reported lag: the labels moved and the content did not, with nothing
// saying it was stale. So a switch empties the mirror and says so, and the first read fills it.
function clearPaneMirror() {
  const el = document.getElementById('termContent');
  if (!el) return;
  // A range left inside the old output would make the `pane_content` handler refuse to render the
  // new pane's first read -- selectionInside guards the mirror and cannot tell a stale range from a
  // live one -- and a caret would survive into a buffer it never pointed at. Both are anchored in
  // text that is about to stop existing, so both go. Only ever OUR text: a selection anywhere else
  // on the page is the reader's and is none of this function's business.
  const sel = window.getSelection && window.getSelection();
  if (sel && sel.rangeCount && el.contains(sel.anchorNode)) sel.removeAllRanges();
  el.__mirror = null;   // mirrorPatch reconciles against this, and it now describes another pane
  el.replaceChildren(document.createTextNode('Loading…'));
  el.scrollTop = 0;
}

function openTerminal(paneId) {
  // Re-entered on every blocked event for the pane already open, so only a real switch closes these
  // -- the history panel belongs to one conversation, and the search holds the OTHER pane's output
  // in `originalContent`. Leaving the search open across a switch (which the sibling chips made a
  // one-tap move) meant the next keystroke restored pane A's output into pane B's session.
  // The reading state goes with them, for the same reason: a re-entry is a title refresh, and
  // resetting it on one would drop a reader who had paged back to the live screen the moment
  // their agent asked a question -- the one moment they are most likely to be reading.
  if (activePane !== paneId) {
    hideHistory(); hideSearch(); clearPaneMirror();
    paneLines = PANE_LINES_BASE; paneFollowing = true; userScrolledUp = false;
  }
  activePane = paneId;
  const a = agents.find(x => x.pane_id===paneId);
  const shell = shellPane(paneId);
  // A terminal is named by its id, because its directory usually is not unique on the host. The
  // process name lands here once the read comes back (see paneTitle).
  document.getElementById('termTitle').textContent = a
    ? `${a.label||a.workspace_label||a.project} · ${a.agent}`
    : shell ? `${shell.label||shell.project||shell.pane_id} · ${shell.pane_id}` : paneId;
  // A pane that names no agent session has no transcript to show. `false` only -- undefined means
  // the relay doesn't report it, and the button stays. A terminal never has one.
  const historyBtn = document.querySelector('.history-btn');
  if (historyBtn) historyBtn.style.display = (shell || (a && a.has_session === false)) ? 'none' : '';
  renderSiblings();
  document.getElementById('agentListView').style.display = 'none';
  if (refreshInterval) clearInterval(refreshInterval);
  document.getElementById('terminalView').classList.add('active');
  // AFTER the view is displayed: renderSiblings ran while it was still display:none, where every
  // rect is zero and no chip can be found to be off screen. A rebuilt strip loses its scroll
  // position anyway (replaceChildren empties it, and an empty box has nothing to scroll), so this
  // is a restore rather than a jump -- it does not fight a reader who scrolled the row by hand.
  scrollSibsToOpenPane();
  navPush('terminal', hideTerminal);
  const qa = document.getElementById('quickActions');
  const ak = document.getElementById('actionKeys');
  qa.replaceChildren();
  ak.replaceChildren();
  if (a&&a.status==='blocked') {
    const opts = a.interaction==='omp_question'&&a.multi
      ? (Array.isArray(a.multi_options)?a.multi_options:[])
      : (Array.isArray(a.options)?a.options:[]);
    for (const option of opts) {
      const button = document.createElement('button');
      const lower = option.toLowerCase();
      button.className = lower.includes('yes')||lower.includes('approve')?'btn-yes':lower.includes('trust')?'btn-trust':'btn-no';
      button.textContent = option.split(',')[0];
      if (a.interaction==='omp_question'&&a.multi) {
        button.dataset.selected=String((a.selected_options||[]).includes(option));
        button.classList.toggle('selected',button.dataset.selected==='true');
        button.addEventListener('click',()=>{
          const selected=button.dataset.selected!=='true';
          button.dataset.selected=String(selected);
          button.classList.toggle('selected',selected);
          ws.send(JSON.stringify({type:'question_toggle',pane_id:activePane,prompt_id:a.prompt_id,option}));
        });
      } else {
        button.addEventListener('click',()=>respond(option));
      }
      qa.appendChild(button);
    }
    if (a.interaction==='omp_question'&&a.multi) {
      const submit=document.createElement('button');
      submit.className='btn-yes';
      submit.textContent='Submit';
      submit.addEventListener('click',()=>ws.send(JSON.stringify({type:'question_submit',pane_id:activePane,prompt_id:a.prompt_id})));
      qa.appendChild(submit);
    } else if (a.interaction!=='omp_question'&&opts.includes('yes, single permission')) {
      for (const [label,cls,response] of [
        ['y','key-green','yes, single permission'],
        ['a','key-blue','trust, always allow'],
        ['n','key-red','no (tab to edit)'],
      ]) {
        const button = document.createElement('button');
        button.className = cls;
        button.textContent = label;
        button.addEventListener('click',()=>respond(response));
        ak.appendChild(button);
      }
    }
  }
  refreshPane();
  refreshInterval = setInterval(mirrorTick, 3000);
}

// ---- the mirror's reconciler -------------------------------------------------------------------
//
// Measured in chromium, on every way there is to update text under a selection:
//
//   el.replaceChildren(...)  -> every range inside collapses to (el, 0)
//   node.data = next         -> every range inside collapses to (node, 0)   [spec: replaceData]
//   node.appendData(extra)   -> ranges are untouched
//
// So a node cannot be rewritten without moving what is anchored in it, and what decides whether the
// reader notices is the BLAST RADIUS. `ansiFragment` emits one span per styled RUN and a run spans
// newlines, so a pane with no colour in it is ONE text node holding the whole buffer: a change on
// the last line moved a caret sitting on line 3 to the top of the output. That is the reported bug.
// A touch drag leaves a CARET behind -- and the freeze deliberately ignores carets, because
// freezing on the collapsed range every tap leaves behind would stop the mirror for good -- so the
// tick rebuilt the buffer, the caret came back at (el, 0), and the reader's next drag highlighted
// the FIRST LINE. Collie polls the same mirror every few seconds with no selection code at all,
// because React renders one keyed node per line: a change on line 7 never touches line 3's node.
//
// So the mirror is a line per span from here on, and an update is a reconcile:
//   - identical content              -> no DOM at all (most ticks: an idle pane repeats itself)
//   - the buffer scrolled by k lines -> the lines that stayed keep their NODES (mirrorShift)
//   - a line that only grew          -> appendData, the one range-safe mutation
//   - a line rewritten              -> that LINE rebuilds; the rest of the buffer is not touched
//
// The newline between two lines is a text node BETWEEN the spans rather than inside one, so
// `el.textContent` is byte-identical to the old flat render -- doSearch counts offsets in it.

function mirrorLineNodes(content) {
  const lines = [];
  let line = document.createElement('span');
  line.className = 'term-line';
  // Snapshotted, because appendChild MOVES a node out of the live NodeList being walked.
  for (const run of [...ansiFragment(content).childNodes]) {
    const text = run.textContent;
    // A run that does not straddle a newline -- almost all of them -- is adopted whole rather than
    // cloned. Measured on a 1000-line coloured buffer, that is the difference between building 5000
    // nodes a tick and 3000.
    if (!text.includes('\n')) { line.appendChild(run); continue; }
    const parts = text.split('\n');
    for (let i = 0; i < parts.length; i++) {
      if (i > 0) {
        lines.push(line);
        line = document.createElement('span');
        line.className = 'term-line';
      }
      if (!parts[i]) continue;
      const piece = run.cloneNode(false);   // same tag, same inline style, no children
      piece.textContent = parts[i];
      line.appendChild(piece);
    }
  }
  lines.push(line);
  return lines;
}

// Same run, meaning the same box with the same styling -- its TEXT is compared separately, because
// text is the part that can sometimes be healed instead of replaced.
function mirrorSameRun(a, b) {
  return a.nodeName === b.nodeName
    && (a.nodeType !== 1 || a.getAttribute('style') === b.getAttribute('style'));
}

function mirrorTextNode(node) {
  if (node.nodeType === 3) return node;
  return node.childNodes.length === 1 && node.firstChild.nodeType === 3 ? node.firstChild : null;
}

// One line against what it should say. Returns whether the DOM moved.
function mirrorPatchLine(line, want) {
  const have = [...line.childNodes], next = [...want.childNodes];
  let i = 0, changed = false;
  for (; i < have.length && i < next.length; i++) {
    const a = have[i], b = next[i];
    if (!mirrorSameRun(a, b)) break;
    const was = a.textContent, now = b.textContent;
    if (was === now) continue;
    const text = mirrorTextNode(a);
    if (!text || !now.startsWith(was)) break;
    text.appendData(now.slice(was.length));
    changed = true;
  }
  if (i < have.length) { line.replaceChildren(...next); return true; }
  for (; i < next.length; i++) { line.appendChild(next[i]); changed = true; }
  return changed;
}

// How far the buffer scrolled between two reads, or 0. A terminal that printed k lines reports the
// same text k rows up, and every line that stayed is a node that can stay with it -- which is the
// only way a range survives a pane that is actually working. Verified in FULL before it is acted on,
// since a wrong k would delete lines that are still on screen, and capped because a jump of more
// than a screenful is a repaint rather than a scroll.
const MIRROR_SHIFT_MAX = 64;
function mirrorShift(have, want) {
  if (have.length !== want.length) return 0;
  for (let k = 1; k <= Math.min(MIRROR_SHIFT_MAX, have.length - 1); k++) {
    let all = true;
    for (let i = 0; i + k < have.length; i++) {
      if (have[i + k] !== want[i]) { all = false; break; }
    }
    if (all) return k;
  }
  return 0;
}

// A caret in a line that is about to be deleted is DROPPED, not left to fall back to (el, 0) --
// which is precisely where the reader's next drag would extend from, highlighting the first line of
// the output. Only ever a caret: a real selection stops the whole patch before it starts.
function mirrorDropCaretIn(node) {
  const sel = window.getSelection && window.getSelection();
  if (!sel || !sel.rangeCount || !sel.isCollapsed) return;
  if (node.contains(sel.anchorNode)) sel.removeAllRanges();
}

// Returns whether anything changed, because the scroll fix-up above -- which pins an unscrolled
// mirror to the bottom -- is only owed on a change.
function mirrorPatch(el, content) {
  if (el.__mirror === content) return false;
  const want = mirrorLineNodes(content);
  const lines = [...el.children];
  // n spans with the n-1 newlines between them is the structure this function builds. Anything else
  // -- the initial "Loading…", a search rewrite, a pane opened before any of this ran -- is built
  // from scratch rather than reconciled against.
  if (el.__mirror == null || !lines.length || el.childNodes.length !== 2 * lines.length - 1) {
    el.__mirror = content;
    const flat = [];
    want.forEach((node, i) => { if (i) flat.push(document.createTextNode('\n')); flat.push(node); });
    el.replaceChildren(...flat);
    return true;
  }
  el.__mirror = content;
  let changed = false;
  const shift = mirrorShift(lines.map(l => l.textContent), want.map(l => l.textContent));
  for (let i = 0; i < shift; i++) {
    const gap = lines[i].nextSibling;          // the newline that followed it
    mirrorDropCaretIn(lines[i]);
    lines[i].remove();
    if (gap && gap.nodeType === 3) gap.remove();
    changed = true;
  }
  lines.splice(0, shift);
  const shared = Math.min(lines.length, want.length);
  for (let i = 0; i < shared; i++) if (mirrorPatchLine(lines[i], want[i])) changed = true;
  for (let i = lines.length - 1; i >= want.length; i--) {
    const gap = lines[i].previousSibling;
    mirrorDropCaretIn(lines[i]);
    lines[i].remove();
    if (gap && gap.nodeType === 3) gap.remove();
    changed = true;
  }
  for (let i = lines.length; i < want.length; i++) {
    if (el.childNodes.length) el.appendChild(document.createTextNode('\n'));
    el.appendChild(want[i]);
    changed = true;
  }
  return changed;
}

// The interval's whole body, named so the rule can be measured rather than read. The read is not
// even sent while a selection is held: it would cost the relay a herdr call -- an SSH round trip
// for a remote host -- to fetch content this tick has already decided it may not render.
function mirrorTick() {
  // History does not change under you. Once the reader has paged back, the live screen is no
  // longer what is on display, so there is nothing for a tick to keep up to date.
  if (!paneFollowing) return;
  if (selectionInside(document.getElementById('termContent'))) return;
  refreshPane();
}

function closeTerminal() { navClose('terminal', hideTerminal); }

function hideTerminal() {
  activePane = null; clearInterval(refreshInterval);
  document.getElementById('terminalView').classList.remove('active');
  document.getElementById('agentListView').style.display = '';
}

// The mirror's scrollback window. herdr clamps pane.read at ~1000 lines and doesn't say so --
// 1000, 1500 and 5000 all come back with the same 1000 rows -- so the old 5000 ceiling only ever
// bought bigger requests that fetched nothing new.
const PANE_LINES_BASE = 200, PANE_LINES_STEP = 400, PANE_LINES_MAX = 1000;
let paneLines = PANE_LINES_BASE;

// How deep a scrollback read on the open pane could ever go (relay: `scrollback`, from herdr's
// scroll.max_offset_from_bottom). 0 means herdr retained nothing behind the viewport, so "load
// older" can never return a line it doesn't already have. undefined means an older relay that
// doesn't report it: stay permissive.
//
// This is NOT a way to tell an agent pane from a terminal, and the mirror must not read it as one.
// It used to: an agent TUI runs on the alternate screen, so every agent pane herdr 0.8.0 reported
// answered 0, and the read source was picked off that. On 0.8.2 the number is not even stable for
// one pane: an earlier measurement on this host had 9 of 10 agent panes reporting a ring (151, 434,
// 594, 938, 1262, 1267, 1400, 1662, 8439), a later one had all 9 reporting 0 -- same host, same
// herdr, and w5:p1 is in both sets.
function paneScrollback() {
  const a = paneById(activePane);
  return a ? a.scrollback : undefined;
}
function canLoadMore() {
  if (paneScrollback() === 0) return false;
  return paneLines < PANE_LINES_MAX;
}
// Following the live screen, as opposed to holding a page of scrollback the reader asked for.
// Only this mode auto-refreshes -- see mirrorTick.
let paneFollowing = true;
function refreshPane() {
  if (!ws || ws.readyState !== WebSocket.OPEN || !activePane) return;
  // Every read is `recent`, following or not. `visible` is the rendered grid and nothing else, so
  // following opened the mirror onto one screenful with no history behind it. Priming with a single
  // `recent` read would not have survived either: mirrorPatch reconciles the WHOLE buffer, so the
  // next 3s pass deletes every line the viewport no longer holds.
  //
  // And the per-pane rule this replaces -- `recent` wherever a ring exists -- was a distinction
  // without a difference. Measured on this host (herdr 0.8.2, all 35 live panes, ansi, `recent` 200
  // against `visible` at the pane's own height): all 9 agent panes report no ring, so the two come
  // back BYTE-IDENTICAL. The gap exists only on shell panes holding a ring (+1.4KB to +52KB), and
  // that ring is exactly the scrollback the reader opened the pane to see.
  //
  // Bounded by construction: a follow read is always PANE_LINES_BASE, because loadMore stops the
  // tick before paneLines can grow past it.
  const request = {
    type: 'read_pane',
    pane_id: activePane,
    lines: paneLines,
    format: 'ansi',
    source: 'recent',
  };
  // One extra CLI call on the relay -- one SSH round trip for a remote host -- so it is asked
  // once per terminal, not on the 3s mirror tick. A directory does not identify a shell pane;
  // "zsh" versus "vim" versus an hour-old build does.
  if (shellPane(activePane) && !paneProcess[activePane]) request.process = true;
  ws.send(JSON.stringify(request));
}
// Back to the live screen, and the only way back once the reader has paged into scrollback. The
// refresh button is this rather than a bare re-read, because in held mode a re-read would fetch
// the same page of history again -- a button that visibly does nothing.
function followPane() {
  paneFollowing = true;
  paneLines = PANE_LINES_BASE;
  refreshPane();
}
function loadMore() {
  if (!canLoadMore()) return;
  // A bigger read answers with a DIFFERENT content -- hundreds of lines arriving in FRONT of what
  // is on screen -- so it is the one update mirrorPatch cannot make non-destructively. It waits,
  // like the tick does, rather than collapsing the selection to the top of the output.
  if (selectionInside(document.getElementById('termContent'))) return;
  // Paging back stops the follow. Two reasons, and either alone is enough: the tick would replace
  // the page under the reader on its next pass, and until it did it would be re-fetching whatever
  // paneLines had grown to -- 125.7KB per tick at the 1000-line ceiling, 42KB/s down a tunnel, for
  // output the reader has already scrolled away from.
  paneFollowing = false;
  paneLines = Math.min(paneLines + PANE_LINES_STEP, PANE_LINES_MAX);
  refreshPane();
}

// Every toggle in the session view says whether its panel is open through `aria-pressed`, and the
// CSS fills the chip off that attribute alone. One helper, so a new toggle cannot be added that
// looks pressed without being pressed.
function setPressed(id, on) {
  const el = document.getElementById(id);
  if (el) el.setAttribute('aria-pressed', String(!!on));
}

// Find in output
let searchMatches = [];
let searchIndex = 0;
let originalContent = '';

function toggleSearch() {
  const bar = document.getElementById('termSearch');
  const input = document.getElementById('searchInput');
  if (bar.style.display === 'none') {
    bar.style.display = 'flex';
    setPressed('searchBtn', true);
    // Through navClose, not by hiding the panel: history pushed a history entry, and dropping the
    // element without dropping the entry left the next Back press with nothing to close.
    if (document.getElementById('termHistory').style.display !== 'none') {
      navClose('history', hideHistory);
    }
    input.focus();
  } else {
    hideSearch();
  }
}

function hideSearch() {
  document.getElementById('termSearch').style.display = 'none';
  document.getElementById('searchInput').value = '';
  setPressed('searchBtn', false);
  clearSearch();
}

// The panel is absolutely positioned inside the terminal view and has to start below its header,
// which is 45px tall on a phone and taller on a desktop where the layout has more room.
function positionHistoryPanel() {
  const panel = document.getElementById('termHistory');
  const header = document.querySelector('.term-header');
  if (panel.style.display !== 'none' && header) panel.style.top = header.offsetHeight + 'px';
}

function toggleHistory() {
  const panel = document.getElementById('termHistory');
  if (panel.style.display !== 'none') { navClose('history', hideHistory); return; }
  panel.style.display = 'flex';
  setPressed('historyBtn', true);
  positionHistoryPanel();
  hideSearch(); // the two share the space under the header
  navPush('history', hideHistory);
  loadHistory();
}

function hideHistory() {
  document.getElementById('termHistory').style.display = 'none';
  setPressed('historyBtn', false);
}

// The conversation, read from the agent's own transcript rather than the terminal. The relay keeps
// the session reference server-side; all we ever send is the pane and a cursor it gave us.
const HISTORY_PAGE = 200;
// `tools: true` by default. A tool call is most of what an agent's turn actually consists of -- on
// the largest session here 674 of 794 turns were tool calls -- so a history that hides them reads
// as a conversation with holes in it. The cost is real and known: tool turns spend page slots and
// characters from the same budget as the prose, so a page reaches less far back. The Tools chip
// turns them off for exactly that case.
let history_ = { turns: [], total: 0, hasMore: false, fileTruncated: false,
                 tools: true, loading: false, unavailable: null };

function loadHistory(before) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !activePane) return;
  if (history_.loading) return;
  if (!before) {
    history_ = { turns: [], total: 0, hasMore: false, fileTruncated: false,
                 tools: history_.tools, loading: true, unavailable: null };
    closeHistoryFind();
    document.getElementById('historyContent').innerHTML = '<div class="hist-edge">Loading…</div>';
  } else {
    history_.loading = true;
    renderHistory();
  }
  ws.send(JSON.stringify({
    type: 'get_history', pane_id: activePane, limit: HISTORY_PAGE,
    include_tools: history_.tools, ...(before ? { before } : {}),
  }));
}

function loadOlderHistory() {
  if (history_.loading || !history_.hasMore || !history_.turns.length) return;
  loadHistory(history_.turns[0].uuid);
}

// The filter opens IN PLACE of the conversation title, which is what keeps the header one row in
// both states. Closing it clears the needle: a filter that is hiding turns while its input is not
// on screen is a trap, and the panel would look like a conversation with pieces missing.
function toggleHistoryFind() {
  const input = document.getElementById('historyFind');
  const on = input.style.display === 'none';
  input.style.display = on ? '' : 'none';
  document.getElementById('historyTitle').style.display = on ? 'none' : '';
  setPressed('historyFindBtn', on);
  if (on) { input.focus(); return; }
  const had = !!input.value;
  closeHistoryFind();
  if (had) renderHistory();
}

// Back to the title, needle dropped. Also how a fresh page starts: a filter left over from the last
// conversation would hide most of the new one before it had drawn.
function closeHistoryFind() {
  const input = document.getElementById('historyFind');
  input.value = '';
  input.style.display = 'none';
  document.getElementById('historyTitle').style.display = '';
  setPressed('historyFindBtn', false);
}

function toggleHistoryTools() {
  history_.tools = !history_.tools;
  setPressed('historyToolsBtn', history_.tools);
  loadHistory();  // the server pages with tools filtered out, so the whole view has to be refetched
}

// Merge a page in. `before` pages arrive as the turns immediately older than what we have, so they
// go on the front; anything already held wins, in case a cursor was resolved loosely server-side.
function receiveHistory(msg) {
  const older = history_.turns.length > 0;
  history_.loading = false;
  history_.unavailable = msg.unavailable || null;
  history_.total = msg.total || 0;
  history_.hasMore = !!msg.has_more;
  history_.fileTruncated = !!msg.file_truncated;
  const incoming = (msg.messages || []).filter(Boolean);
  if (history_.unavailable) { history_.turns = []; }
  else if (older) {
    const held = new Set(history_.turns.map(t => t.uuid));
    history_.turns = incoming.filter(t => !held.has(t.uuid)).concat(history_.turns);
  } else {
    history_.turns = incoming;
  }
  const title = (msg.title || '').trim();
  document.getElementById('historyTitle').textContent = title || 'Conversation History';
  const el = document.getElementById('historyContent');
  // Anchor on content, not on offset: prepending older turns would otherwise yank the page out
  // from under the reader's thumb.
  const previousHeight = el.scrollHeight, previousTop = el.scrollTop;
  renderHistory();
  if (older) el.scrollTop = previousTop + (el.scrollHeight - previousHeight);
  else el.scrollTop = el.scrollHeight;  // newest turn is at the bottom
}

// Why the history panel is empty, in the user's terms. Each is an ordinary state, not an error.
const HISTORY_UNAVAILABLE = {
  'no-session': 'This pane names no agent session, so there is no transcript to read.',
  'no-log': 'No transcript file was found for this pane\'s session yet.',
  'unsupported': 'This relay cannot read this agent\'s transcript format yet.',
  'disabled': 'Transcript history is switched off on this relay.',
  'error': 'Could not read the transcript. Pull back and try again.',
};

const HISTORY_ROLE_CLASS = { user: 'msg-user', assistant: 'msg-assistant' };

// A tool call the relay could turn into a diff opens on tap. Kept by turn uuid rather than in the
// DOM, because typing in the filter re-renders the whole list on every keystroke and an open diff
// snapping shut under you is worse than the state it saves.
const historyOpen = new Set();

function historyToolNode(turn) {
  const row = document.createElement(turn.diff ? 'details' : 'div');
  row.className = 'msg tool' + (turn.error ? ' failed' : '');
  const head = document.createElement(turn.diff ? 'summary' : 'div');
  head.className = 'tool-head';
  const name = document.createElement('span');
  name.className = 'tool-name';
  name.textContent = turn.tool || 'tool';
  head.appendChild(name);
  const target = document.createElement('span');
  target.className = 'tool-target';
  const full = turn.target || turn.text || '';
  // Verbatim -- this is a path or a shell command, and markdown would eat the asterisks in a
  // glob. Paths are shortened here rather than by `direction: rtl`, which does keep the
  // interesting end visible but reorders the punctuation at both ends of a path or a quoted
  // command. The whole value stays in the tooltip.
  target.textContent = shortenPath(full);
  if (target.textContent !== full) target.title = full;
  head.appendChild(target);
  if (turn.error && turn.result) {
    const why = document.createElement('span');
    why.className = 'tool-error';
    why.textContent = turn.result;
    head.appendChild(why);
  }
  if (turn.diff) {
    const stat = document.createElement('span');
    stat.className = 'tool-stat';
    // The counts are the whole change; the body below may be only its head (see diff_clipped).
    const added = document.createElement('span');
    added.className = 'stat-add'; added.textContent = `+${turn.added || 0}`;
    const removed = document.createElement('span');
    removed.className = 'stat-del'; removed.textContent = `\u2212${turn.removed || 0}`;
    stat.append(added, removed);
    head.appendChild(stat);
  }
  row.appendChild(head);
  if (turn.diff) {
    row.open = historyOpen.has(turn.uuid);
    row.addEventListener('toggle', () => {
      if (row.open) historyOpen.add(turn.uuid); else historyOpen.delete(turn.uuid);
    });
    row.appendChild(diffFragment(turn.diff));
    if (turn.diff_clipped) {
      const edge = document.createElement('div');
      edge.className = 'diff-edge';
      edge.textContent = `showing the first ${turn.diff.split('\n').length} lines`;
      row.appendChild(edge);
    }
  }
  return row;
}

// The last few segments of a path, which is the part that identifies the file. Anything without
// a separator (a shell command, a search pattern) is left alone for CSS to ellipsize.
function shortenPath(text) {
  if (!text.includes('/') || text.includes(' ')) return text;
  const parts = text.split('/').filter(Boolean);
  return parts.length > 3 ? '…/' + parts.slice(-3).join('/') : text;
}

const HISTORY_ROLE_LABEL = { user: 'you', assistant: 'agent', note: 'note' };

/** A turn's time, in the reader's own zone.
 *
 *  Claude writes every transcript timestamp in UTC -- all 4,450 sampled rows on this machine end in
 *  `Z` -- and this used to be `ts.slice(11, 16)`, five characters lifted straight out of that
 *  string. So a turn made at 17:08 in UTC+8 was stamped 09:08, silently, and only for a reader
 *  whose zone was not UTC.
 *
 *  The date rides along when the turn is not from today, because paging back is the whole point of
 *  the panel and `09:08` alone cannot say which day it belongs to. A string the platform will not
 *  parse falls back to the old slice: wrong by an offset still beats blank. */
function turnStamp(ts) {
  if (!ts) return null;
  const at = new Date(ts);
  const stamp = document.createElement('span');
  stamp.className = 'msg-time';
  if (isNaN(at.getTime())) {
    // Not a date this platform knows. The old five characters are still the best guess, and an
    // empty one means the string had nothing there at all -- no span rather than a blank one.
    const raw = String(ts).slice(11, 16);
    if (!raw) return null;
    stamp.textContent = raw;
    return stamp;
  }
  const time = at.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  const sameDay = at.toDateString() === new Date().toDateString();
  stamp.textContent = sameDay ? time
    : `${at.toLocaleDateString([], {month: 'numeric', day: 'numeric'})} ${time}`;
  // The full local date and time, for the one case the short form cannot answer.
  stamp.title = at.toLocaleString();
  return stamp;
}

function historyTurnNode(turn) {
  const role = turn.role || 'note';
  if (role === 'tool') return historyToolNode(turn);
  const block = document.createElement('div');
  block.className = `msg ${role}`;
  const head = document.createElement('div');
  head.className = `msg-role ${HISTORY_ROLE_CLASS[role] || ''}`;
  head.textContent = HISTORY_ROLE_LABEL[role] || role;
  const stamp = turnStamp(turn.ts);
  if (stamp) head.appendChild(stamp);
  block.appendChild(head);
  const body = document.createElement('div');
  body.className = 'msg-text';
  // Agent prose is markdown, and so is much of what a person pastes into the composer. The
  // renderer builds nodes, so nothing in a transcript can become markup on the way through.
  body.appendChild(mdFragment(turn.text || ''));
  if (turn.truncated) {
    const clip = document.createElement('span');
    clip.className = 'msg-clip';
    clip.textContent = ' …clipped';
    body.appendChild(clip);
  }
  block.appendChild(body);
  return block;
}

function renderHistory() {
  const el = document.getElementById('historyContent');
  const count = document.getElementById('historyCount');
  if (history_.unavailable) {
    const copy = HISTORY_UNAVAILABLE[history_.unavailable] || 'Conversation history is unavailable.';
    el.innerHTML = `<div class="hist-edge">${escapeHtml(copy)}</div>`;
    count.textContent = '';
    return;
  }
  const needle = document.getElementById('historyFind').value.trim().toLowerCase();
  const shown = needle
    ? history_.turns.filter(t => (t.text || '').toLowerCase().includes(needle))
    : history_.turns;
  // Say what the filter covers: turns not yet paged in are not searched, and pretending otherwise
  // would read as "no matches in this conversation".
  count.textContent = needle
    ? `${shown.length} in ${history_.turns.length} loaded`
    : (history_.total ? `${history_.turns.length} of ${history_.total}` : '');
  if (!history_.turns.length) {
    el.innerHTML = '<div class="hist-edge">This conversation has no turns yet.</div>';
    return;
  }
  const out = document.createDocumentFragment();
  if (history_.loading) out.appendChild(histEdge('Loading older…'));
  else if (history_.hasMore) {
    const more = document.createElement('button');
    more.className = 'hist-more';
    more.textContent = 'Load older turns';
    more.addEventListener('click', loadOlderHistory);
    out.appendChild(more);
  }
  else if (history_.fileTruncated) out.appendChild(histEdge('Older turns were not fetched from this host.'));
  else out.appendChild(histEdge('Start of the conversation.'));
  if (shown.length) shown.forEach(turn => out.appendChild(historyTurnNode(turn)));
  else out.appendChild(histEdge('No loaded turn matches that.'));
  el.replaceChildren(out);
}

function histEdge(text) {
  const edge = document.createElement('div');
  edge.className = 'hist-edge';
  edge.textContent = text;
  return edge;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// For attribute values, which escapeHtml is not safe for: textContent leaves quotes alone, so a
// name carrying one closes the attribute early. Names are herdr's, and herdr's are the operator's
// -- a tab or agent can be renamed to anything from this very UI.
function escapeAttr(text) {
  return String(text ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function doSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const el = document.getElementById('termContent');
  const countEl = document.getElementById('searchCount');
  
  // Restore original content first
  if (!originalContent) originalContent = el.innerHTML;
  el.innerHTML = originalContent;
  // Written behind mirrorPatch's back, so its record of what the DOM says is void: the next tick
  // reconciles against the live text instead of trusting a string that predates the marks.
  el.__mirror = null;
  
  if (!query || query.length < 2) {
    countEl.textContent = '';
    searchMatches = [];
    return;
  }
  
  // Find and highlight matches
  const text = el.textContent;
  const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  let match;
  searchMatches = [];
  
  while ((match = regex.exec(text)) !== null) {
    searchMatches.push(match.index);
  }
  
  if (searchMatches.length === 0) {
    countEl.textContent = '0/0';
    return;
  }
  
  // Highlight all matches in HTML
  let html = originalContent;
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = html;
  const walker = document.createTreeWalker(tempDiv, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  
  let matchIdx = 0;
  textNodes.forEach(node => {
    const nodeText = node.textContent;
